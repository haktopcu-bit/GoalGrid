<script>

const API =
  "https://v3.football.api-sports.io";


const LEAGUES = {

  39:{
    name:"Premier League",
    csv:"E0"
  },

  40:{
    name:"Championship",
    csv:"E1"
  },

  78:{
    name:"Bundesliga",
    csv:"D1"
  },

  135:{
    name:"Serie A",
    csv:"I1"
  },

  140:{
    name:"La Liga",
    csv:"SP1"
  },

  61:{
    name:"Ligue 1",
    csv:"F1"
  },

  88:{
    name:"Eredivisie",
    csv:"N1"
  },

  89:{
    name:"Eerste Divisie",
    csv:null
  },

  203:{
    name:"Süper Lig",
    csv:"T1"
  },

  204:{
    name:"Türkiye 1. Lig",
    csv:null
  },

  144:{
    name:"Jupiler Pro League",
    csv:"B1"
  },

  2:{
    name:"Şampiyonlar Ligi",
    csv:null
  },

  3:{
    name:"Avrupa Ligi",
    csv:null
  },

  848:{
    name:"Konferans Ligi",
    csv:null
  }

};


let state = {
  analyses:[],
  tab:"best",
  calls:0
};


const $ = selector =>
  document.querySelector(selector);


function apiKey(){

  return localStorage.getItem(
    "goalgrid_api_key"
  ) || "";

}


async function api(path){

  state.calls++;

  $("#calls").textContent =
    state.calls;


  const response =
    await fetch(
      API + path,
      {
        headers:{
          "x-apisports-key":
            apiKey()
        }
      }
    );


  const data =
    await response.json();


  if(
    data.errors &&
    Object.keys(data.errors).length
  ){

    throw new Error(
      JSON.stringify(data.errors)
    );

  }


  return data.response || [];

}


function trDate(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Istanbul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(
    new Date()
  );

}


function parseCSV(text){

  const rows=[];

  let row=[];
  let cell="";
  let quoted=false;


  for(
    let i=0;
    i<text.length;
    i++
  ){

    const ch=text[i];


    if(ch === '"'){

      if(
        quoted &&
        text[i+1] === '"'
      ){

        cell += '"';
        i++;

      }else{

        quoted =
          !quoted;

      }

    }else if(
      ch === "," &&
      !quoted
    ){

      row.push(cell);
      cell="";

    }else if(
      (
        ch === "\n" ||
        ch === "\r"
      )
      &&
      !quoted
    ){

      if(
        ch === "\r" &&
        text[i+1] === "\n"
      ){
        i++;
      }


      row.push(cell);


      if(
        row.some(
          x => x !== ""
        )
      ){

        rows.push(row);

      }


      row=[];
      cell="";

    }else{

      cell += ch;

    }

  }


  if(
    cell ||
    row.length
  ){

    row.push(cell);
    rows.push(row);

  }


  if(rows.length < 2){

    return [];

  }


  const headers =
    rows[0].map(
      x => x.trim()
    );


  return rows
    .slice(1)
    .map(r => {

      const obj={};


      headers.forEach(
        (h,i) => {

          obj[h] =
            (r[i] ?? "")
            .trim();

        }
      );


      return obj;

    });

}


async function loadCSV(code){

  const cacheKey =
    "gg_csv_v121_" + code;


  const saved =
    localStorage.getItem(
      cacheKey
    );


  if(saved){

    try{

      const cache =
        JSON.parse(saved);


      if(
        Date.now() -
        cache.time
        <
        30 * 60 * 1000
      ){

        return cache.rows;

      }

    }catch{}

  }


  const response =
    await fetch(
      `/csv?code=${encodeURIComponent(code)}`
    );


  if(!response.ok){

    throw new Error(
      `CSV ${code}: HTTP ${response.status}`
    );

  }


  const text =
    await response.text();


  const rows =
    parseCSV(text);


  localStorage.setItem(
    cacheKey,
    JSON.stringify({
      time:Date.now(),
      rows
    })
  );


  return rows;

}


function norm(value){

  return String(value || "")
    .toLocaleLowerCase("tr")
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^a-z0-9]/g,
      ""
    );

}


const ALIASES = {

  manchesterunited:
    "manunited",

  manchestercity:
    "mancity",

  tottenhamhotspur:
    "tottenham",

  wolverhamptonwanderers:
    "wolves",

  nottinghamforest:
    "nottmforest",

  internazionale:
    "inter",

  parissaintgermain:
    "psg",

  atleticoMadrid:
    "athmadrid",

  atleticomadrid:
    "athmadrid",

  caykurrizespor:
    "rizespor",

  gaziantepfk:
    "gaziantep",

  istanbulbasaksehir:
    "basaksehir",

  esenlererokspor:
    "erokspor"

};


function teamKey(name){

  const n =
    norm(name);

  return(
    ALIASES[n]
    ||
    n
  );

}


function sameTeam(
  one,
  two
){

  const a =
    teamKey(one);

  const b =
    teamKey(two);


  if(!a || !b){

    return false;

  }


  if(a === b){

    return true;

  }


  if(
    a.length >= 5 &&
    b.includes(a)
  ){

    return true;

  }


  if(
    b.length >= 5 &&
    a.includes(b)
  ){

    return true;

  }


  return false;

}


function numberValue(value){

  const n =
    parseFloat(value);


  return(
    Number.isFinite(n)
    ? n
    : null
  );

}


function completed(row){

  return(
    row.HomeTeam &&
    row.AwayTeam &&
    numberValue(row.FTHG) !== null &&
    numberValue(row.FTAG) !== null
  );

}


function getLastGames(
  team,
  rows,
  venue=null
){

  let list =
    rows.filter(row =>

      completed(row)

      &&

      (
        sameTeam(
          team,
          row.HomeTeam
        )

        ||

        sameTeam(
          team,
          row.AwayTeam
        )
      )

    );


  if(
    venue === "home"
  ){

    list =
      list.filter(
        row =>
          sameTeam(
            team,
            row.HomeTeam
          )
      );

  }


  if(
    venue === "away"
  ){

    list =
      list.filter(
        row =>
          sameTeam(
            team,
            row.AwayTeam
          )
      );

  }


  return list
    .slice(-10)
    .reverse();

}


function formStats(
  team,
  games
){

  if(!games.length){

    return{
      n:0,
      gf:0,
      ga:0,
      ppg:0,
      btts:0,
      o15:0,
      o25:0,
      shots:null,
      sot:null,
      corners:null,
      cards:null,
      variance:0
    };

  }


  let gf=0;
  let ga=0;
  let pts=0;
  let totalWeight=0;

  let btts=0;
  let o15=0;
  let o25=0;

  let shots=0;
  let shotsN=0;

  let sot=0;
  let sotN=0;

  let corners=0;
  let cornersN=0;

  let cards=0;
  let cardsN=0;

  const totals=[];


  games.forEach(
    (row,index) => {

      const home =
        sameTeam(
          team,
          row.HomeTeam
        );


      const scored =
        home
        ? numberValue(row.FTHG)
        : numberValue(row.FTAG);


      const conceded =
        home
        ? numberValue(row.FTAG)
        : numberValue(row.FTHG);


      const weight =
        Math.pow(
          0.90,
          index
        );


      gf +=
        scored * weight;


      ga +=
        conceded * weight;


      if(
        scored > conceded
      ){

        pts +=
          3 * weight;

      }else if(
        scored === conceded
      ){

        pts +=
          1 * weight;

      }


      totalWeight += weight;


      if(
        scored > 0 &&
        conceded > 0
      ){
        btts++;
      }


      if(
        scored +
        conceded
        >= 2
      ){
        o15++;
      }


      if(
        scored +
        conceded
        >= 3
      ){
        o25++;
      }


      totals.push(
        scored +
        conceded
      );


      const s =
        home
        ? numberValue(row.HS)
        : numberValue(row.AS);


      if(
        s !== null
      ){
        shots += s;
        shotsN++;
      }


      const st =
        home
        ? numberValue(row.HST)
        : numberValue(row.AST);


      if(
        st !== null
      ){
        sot += st;
        sotN++;
      }


      const c =
        home
        ? numberValue(row.HC)
        : numberValue(row.AC);


      if(
        c !== null
      ){
        corners += c;
        cornersN++;
      }


      const yellow =
        home
        ? numberValue(row.HY)
        : numberValue(row.AY);


      const red =
        home
        ? numberValue(row.HR)
        : numberValue(row.AR);


      if(
        yellow !== null ||
        red !== null
      ){

        cards +=
          (yellow || 0)
          +
          (red || 0) * 2;

        cardsN++;

      }

    }
  );


  const mean =
    totals.reduce(
      (sum,x) =>
        sum + x,
      0
    )
    /
    totals.length;


  const variance =
    totals.reduce(
      (sum,x) =>
        sum +
        Math.pow(
          x - mean,
          2
        ),
      0
    )
    /
    totals.length;


  return{

    n:
      games.length,

    gf:
      gf / totalWeight,

    ga:
      ga / totalWeight,

    ppg:
      pts / totalWeight,

    btts:
      btts / games.length,

    o15:
      o15 / games.length,

    o25:
      o25 / games.length,

    shots:
      shotsN
      ? shots / shotsN
      : null,

    sot:
      sotN
      ? sot / sotN
      : null,

    corners:
      cornersN
      ? corners / cornersN
      : null,

    cards:
      cardsN
      ? cards / cardsN
      : null,

    variance

  };

}


function poisson(
  k,
  lambda
){

  let factorial=1;


  for(
    let i=2;
    i<=k;
    i++
  ){

    factorial *= i;

  }


  return(
    Math.exp(-lambda)
    *
    Math.pow(lambda,k)
    /
    factorial
  );

}


function poissonMarkets(
  homeLambda,
  awayLambda
){

  let home=0;
  let draw=0;
  let away=0;

  let btts=0;
  let o15=0;
  let o25=0;
  let o35=0;


  for(
    let hg=0;
    hg<=8;
    hg++
  ){

    for(
      let ag=0;
      ag<=8;
      ag++
    ){

      const p =
        poisson(
          hg,
          homeLambda
        )
        *
        poisson(
          ag,
          awayLambda
        );


      if(hg > ag){

        home += p;

      }else if(
        hg === ag
      ){

        draw += p;

      }else{

        away += p;

      }


      if(
        hg > 0 &&
        ag > 0
      ){

        btts += p;

      }


      if(
        hg + ag >= 2
      ){

        o15 += p;

      }


      if(
        hg + ag >= 3
      ){

        o25 += p;

      }


      if(
        hg + ag >= 4
      ){

        o35 += p;

      }

    }

  }


  return{
    home,
    draw,
    away,
    btts,
    o15,
    o25,
    o35
  };

}


function blend(
  modelValue,
  historicValue,
  modelWeight=.72
){

  return(
    modelValue * modelWeight
    +
    historicValue *
    (1-modelWeight)
  );

}


function dataQualityScore(
  homeN,
  awayN,
  hasAdvancedStats
){

  const n =
    Math.min(
      homeN,
      awayN
    );


  let score=10;


  if(n >= 10){

    score=95;

  }else if(n >= 8){

    score=88;

  }else if(n >= 6){

    score=78;

  }else if(n >= 4){

    score=63;

  }else if(n >= 2){

    score=42;

  }


  if(
    hasAdvancedStats
  ){

    score += 5;

  }


  return Math.min(
    100,
    score
  );

}


function classification(
  composite,
  quality
){

  if(
    quality < 45
  ){

    return[
      "PASS",
      "pass"
    ];

  }


  if(
    composite >= 88
  ){

    return[
      "A+",
      "aplus"
    ];

  }


  if(
    composite >= 81
  ){

    return[
      "A",
      "a"
    ];

  }


  if(
    composite >= 72
  ){

    return[
      "B",
      "b"
    ];

  }


  return[
    "PASS",
    "pass"
  ];

}


function analyze(
  fixture,
  rows,
  source
){

  const home =
    fixture.teams.home.name;


  const away =
    fixture.teams.away.name;


  const homeGames =
    getLastGames(
      home,
      rows
    );


  const awayGames =
    getLastGames(
      away,
      rows
    );


  const homeVenueGames =
    getLastGames(
      home,
      rows,
      "home"
    );


  const awayVenueGames =
    getLastGames(
      away,
      rows,
      "away"
    );


  const homeAll =
    formStats(
      home,
      homeGames
    );


  const awayAll =
    formStats(
      away,
      awayGames
    );


  const homeVenue =
    formStats(
      home,
      homeVenueGames
    );


  const awayVenue =
    formStats(
      away,
      awayVenueGames
    );


  const advancedStats =
    (
      homeAll.shots !== null
      ||
      awayAll.shots !== null
    );


  const dq =
    dataQualityScore(
      homeAll.n,
      awayAll.n,
      advancedStats
    );


  if(
    homeAll.n < 2
    ||
    awayAll.n < 2
  ){

    return{

      fixture,

      grade:
        "PASS",

      gradeClass:
        "pass",

      market:
        "VERİ YETERSİZ",

      probability:
        0,

      score:
        0,

      dataQuality:
        dq,

      noBet:
        true,

      source,

      reason:
        "Takımlardan en az biri için yeterli güncel geçmiş maç bulunamadı."

    };

  }


  const homeGF =
    homeVenue.n >= 3
    ? blend(
        homeVenue.gf,
        homeAll.gf,
        .65
      )
    : homeAll.gf;


  const homeGA =
    homeVenue.n >= 3
    ? blend(
        homeVenue.ga,
        homeAll.ga,
        .65
      )
    : homeAll.ga;


  const awayGF =
    awayVenue.n >= 3
    ? blend(
        awayVenue.gf,
        awayAll.gf,
        .65
      )
    : awayAll.gf;


  const awayGA =
    awayVenue.n >= 3
    ? blend(
        awayVenue.ga,
        awayAll.ga,
        .65
      )
    : awayAll.ga;


  let hx =
    .46 * homeGF
    +
    .34 * awayGA
    +
    .20 * 1.42;


  let ax =
    .46 * awayGF
    +
    .34 * homeGA
    +
    .20 * 1.18;


  if(
    homeAll.sot !== null
    &&
    awayAll.sot !== null
  ){

    const shotEdge =
      (
        homeAll.sot -
        awayAll.sot
      ) * .025;


    hx += shotEdge;

    ax -=
      shotEdge * .40;

  }


  hx =
    Math.max(
      .25,
      Math.min(
        3.6,
        hx
      )
    );


  ax =
    Math.max(
      .20,
      Math.min(
        3.4,
        ax
      )
    );


  const poissonResult =
    poissonMarkets(
      hx,
      ax
    );


  const historic = {

    btts:
      (
        homeAll.btts +
        awayAll.btts
      ) / 2,

    o15:
      (
        homeAll.o15 +
        awayAll.o15
      ) / 2,

    o25:
      (
        homeAll.o25 +
        awayAll.o25
      ) / 2

  };


  const markets = {

    "1.5 Üst":
      blend(
        poissonResult.o15,
        historic.o15
      ),

    "2.5 Üst":
      blend(
        poissonResult.o25,
        historic.o25
      ),

    "KG Var":
      blend(
        poissonResult.btts,
        historic.btts
      ),

    "1X":
      poissonResult.home
      +
      poissonResult.draw,

    "X2":
      poissonResult.away
      +
      poissonResult.draw,

    "Ev Sahibi":
      poissonResult.home,

    "Deplasman":
      poissonResult.away,

    "3.5 Üst":
      poissonResult.o35

  };


  const ranked =
    Object.entries(
      markets
    )
    .map(
      ([name,probability]) => ({
        name,
        probability
      })
    )
    .sort(
      (a,b) =>
        b.probability -
        a.probability
    );


  const main =
    ranked[0];


  const secondary =
    ranked[1];


  const agreement =
    100 -
    Math.min(
      100,

      Math.abs(
        poissonResult.o25 -
        historic.o25
      ) * 135

      +

      Math.abs(
        poissonResult.btts -
        historic.btts
      ) * 90
    );


  const volatility =
    Math.min(
      100,

      (
        (
          homeAll.variance +
          awayAll.variance
        )
        /
        2
      )
      * 23
    );


  let composite =
    main.probability
    * 100;


  composite +=
    dq * .06;


  composite +=
    agreement * .045;


  composite -=
    volatility * .035;


  if(
    homeAll.n < 4
    ||
    awayAll.n < 4
  ){

    composite -= 6;

  }


  composite =
    Math.round(
      Math.max(
        0,
        Math.min(
          96,
          composite
        )
      )
    );


  const grade =
    classification(
      composite,
      dq
    );


  const risks=[];


  if(
    dq < 70
  ){

    risks.push(
      "Sınırlı veri örneklemi"
    );

  }


  if(
    volatility >= 65
  ){

    risks.push(
      "Yüksek skor volatilitesi"
    );

  }


  if(
    homeAll.n < 5
    ||
    awayAll.n < 5
  ){

    risks.push(
      "Sezon başı model belirsizliği"
    );

  }


  return{

    fixture,

    hx,
    ax,

    markets,

    homeAll,
    awayAll,

    score:
      composite,

    grade:
      grade[0],

    gradeClass:
      grade[1],

    market:
      main.name,

    probability:
      main.probability,

    secondary,

    dataQuality:
      Math.round(dq),

    agreement:
      Math.round(agreement),

    volatility:
      Math.round(volatility),

    risks,

    source,

    noBet:
      grade[0] === "PASS"

  };

}


function unsupported(
  fixture
){

  return{

    fixture,

    grade:
      "PASS",

    gradeClass:
      "pass",

    market:
      "GEÇMİŞ VERİ KAYNAĞI YOK",

    probability:
      0,

    score:
      0,

    dataQuality:
      0,

    source:
      "API-Football fikstür",

    reason:
      "Bu lig için ücretsiz güncel geçmiş istatistik kaynağı henüz bağlanmadı.",

    noBet:
      true

  };

}


async function run(
  force=false
){

  if(
    !apiKey()
  ){

    alert(
      "API key bulunamadı. Önceki GoalGrid sürümünde kaydettiğin API key tarayıcı hafızasında yok."
    );

    return;

  }


  state.calls=0;

  $("#calls").textContent=
    "0";


  const today =
    trDate();


  const cacheKey =
    "goalgrid_v121_"
    + today;


  const saved =
    localStorage.getItem(
      cacheKey
    );


  if(
    saved &&
    !force
  ){

    try{

      const cache =
        JSON.parse(saved);


      if(
        Date.now() -
        cache.time
        <
        2 * 60 * 60 * 1000
      ){

        state.analyses =
          cache.analyses || [];


        render();


        $("#runStatus").textContent =
          "✓ Analiz önbellekten açıldı. API kotası kullanılmadı.";


        return;

      }

    }catch{}

  }


  $("#runStatus").textContent =
    "Bugünün maçları API-Football'dan alınıyor…";


  try{

    const fixtures =
      await api(
        `/fixtures?date=${today}&timezone=Europe/Istanbul`
      );


    const games =
      fixtures.filter(
        fixture =>
          Boolean(
            LEAGUES[
              fixture.league.id
            ]
          )
      );


    if(
      !games.length
    ){

      state.analyses=[];

      render();


      $("#runStatus").textContent =
        "Bugün seçili liglerde maç bulunamadı.";


      return;

    }


    const csvCodes =
      [
        ...new Set(
          games
            .map(
              fixture =>
                LEAGUES[
                  fixture.league.id
                ].csv
            )
            .filter(Boolean)
        )
      ];


    $("#runStatus").textContent =
      `${games.length} maç bulundu. ${csvCodes.length} ücretsiz geçmiş veri dosyası alınıyor…`;


    const pools={};


    for(
      const code
      of csvCodes
    ){

      try{

        pools[code] =
          await loadCSV(
            code
          );

      }catch(error){

        console.error(
          "CSV error",
          code,
          error
        );

        pools[code]=[];

      }

    }


    state.analyses =
      games
        .map(
          fixture => {

            const cfg =
              LEAGUES[
                fixture.league.id
              ];


            if(
              !cfg.csv
            ){

              return unsupported(
                fixture
              );

            }


            const rows =
              pools[
                cfg.csv
              ] || [];


            if(
              !rows.length
            ){

              return{

                ...unsupported(
                  fixture
                ),

                market:
                  "CSV VERİSİ ALINAMADI",

                reason:
                  `${cfg.name} geçmiş CSV dosyası boş veya erişilemedi.`

              };

            }


            return analyze(
              fixture,
              rows,
              `Football-Data ${cfg.csv}`
            );

          }
        )
        .sort(
          (a,b) =>
            b.score -
            a.score
        );


    localStorage.setItem(
      cacheKey,
      JSON.stringify({
        time:
          Date.now(),

        analyses:
          state.analyses
      })
    );


    render();


    $("#runStatus").textContent =
      `✓ ${games.length} maç işlendi • ${state.calls} API çağrısı • ${csvCodes.length} ücretsiz geçmiş veri kaynağı.`;


  }catch(error){

    $("#runStatus").textContent =
      "Hata: "
      + error.message;

  }

}


function meter(
  title,
  value
){

  return`
    <div class="metric">

      <small>
        ${title}
      </small>

      <b>
        ${value}/100
      </b>

      <div class="bar">

        <div
          class="fill"
          style="width:${value}%">
        </div>

      </div>

    </div>
  `;

}

            ${kickoff}
          </div>

              ${a.market}

              <span class="grade pass">
                PASS

            </div>

          </div>

        </div>


        <div class="reason bad">

        </div>

          ${a.source}

            ${fixture.league.name}

          <div class="teams">

          ${kickoff}

          </div>

      <div class="metrics">

        <div class="metric">

          <small>
            Beklenen Gol

          <b>
            ${a.hx.toFixed(2)}
            —
            ${a.ax.toFixed(2)}
          </b>

        </div>


        <div class="metric">

          <small>
            Toplam Gol
          </small>

          <b>
            ${(a.hx+a.ax).toFixed(2)}

        </div>


        <div class="metric">

          <small>

          </b>

        </div>


        <div class="metric">

          <small>
            2.5 Üst
          </small>

          <b>
            %${Math.round(a.markets["2.5 Üst"]*100)}
          </b>

        </div>


        <div class="metric">

          <small>
            KG Var
          </small>

          <b>
            %${Math.round(a.markets["KG Var"]*100)}
          </b>

        </div>


        <div class="metric">

          <small>
            1X
          </small>

          <b>
            %${Math.round(a.markets["1X"]*100)}
          </b>

        </div>


        <div class="metric">

          <small>
            X2
          </small>

          <b>
            %${Math.round(a.markets["X2"]*100)}
          </b>

        </div>


        <div class="metric">

          <small>
            Alternatif
          </small>

          <b>
            ${a.secondary.name}
            %${Math.round(a.secondary.probability*100)}
          </b>

        </div>

      </div>


      <div class="section">

        <div class="sectionTitle">
          GERÇEK FORM
        </div>


        <div class="metrics">

          <div class="metric">

            <small>
              Örneklem
            </small>

            <b>
              ${a.homeAll.n}
              /
              ${a.awayAll.n}
            </b>

          </div>


          <div class="metric">

            <small>
              Ağırlıklı PPG
            </small>

            <b>
              ${a.homeAll.ppg.toFixed(2)}
              /
              ${a.awayAll.ppg.toFixed(2)}
            </b>

          </div>


          <div class="metric">

            <small>
              Gol Üretimi
            </small>

            <b>
              ${a.homeAll.gf.toFixed(2)}
              /
              ${a.awayAll.gf.toFixed(2)}
            </b>

          </div>


          <div class="metric">

            <small>
              Gol Yeme

              a.agreement

            meter(
              "Volatilite",
              a.volatility

          }

            meter(

                100-a.volatility

          /

          /
          ${a.awayAll.gf.toFixed(2)}
          •

      <div class="section">

        <div class="sectionTitle">
          RİSKLER
        </div>


        <div class="reason ${a.risks.length?"warn":"good"}">

          ${
            a.risks.length
            ? a.risks.join(" • ")
            : "Mevcut veri katmanında belirgin yapısal risk tespit edilmedi."
          }

      </div>


      <div class="sourceTag">
        ${a.source}
      </div>

    </section>
  `;

}


function render(){

  $("#nMatches").textContent =
    state.analyses.length;


  $("#nA").textContent =
    state.analyses.filter(
      a =>
        a.grade === "A"
        ||
        a.grade === "A+"
    ).length;


  $("#nPass").textContent =
    state.analyses.filter(
      a =>
        a.grade === "PASS"
    ).length;


  let list =
    [...state.analyses];


  if(
    state.tab === "best"
  ){

    list =
      list.filter(
        a =>
          a.grade === "A"
          ||
          a.grade === "A+"
      );

  }


  if(
    !list.length
  ){

    $("#content").innerHTML =
      `
      <div class="empty">
        Bu kategoride maç bulunmuyor.
      </div>
      `;

    return;

  }


  $("#content").innerHTML =
    list
      .map(card)
      .join("");

}


document
  .querySelectorAll(".tab")
  .forEach(
    button => {

      button.onclick =
        () => {

          document
            .querySelectorAll(".tab")
            .forEach(
              item =>
                item
                  .classList
                  .remove("active")
            );


          button
            .classList
            .add("active");


          state.tab =
            button.dataset.tab;


          render();

        };

    }
  );
