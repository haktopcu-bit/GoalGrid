<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#07101d">

<meta
  name="apple-mobile-web-app-capable"
  content="yes">

<title>GoalGrid V1.3</title>

<style>
:root{
  --bg:#07101d;
  --card:#101b2b;
  --card2:#142238;
  --text:#eef4ff;
  --muted:#8fa1b9;
  --green:#6ee7b7;
  --blue:#93c5fd;
  --line:#24324a;
  --red:#fb7185;
  --yellow:#fcd34d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#08111f,#060b13);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}

main{
  max-width:840px;
  margin:auto;
  padding:calc(22px + env(safe-area-inset-top)) 13px 180px;
}

h1{
  font-size:31px;
  margin:0;
}

.altbaslik{
  color:var(--muted);
  margin:4px 0 16px;
}

.kart{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  font-weight:800;
  font-size:14px;
}

.birincil{
  background:var(--green);
  color:#052218;
}

.ikincil{
  background:#183149;
  color:#dcecff;
}

.tehlike{
  background:#40222d;
  color:#ffb8c5;
}

.ustSatir{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.lig{
  font-size:11px;
  color:var(--muted);
}

.takimlar{
  font-size:17px;
  font-weight:850;
  margin-top:3px;
}

.saat{
  font-size:12px;
  color:var(--blue);
  font-weight:800;
}

.durum{
  font-size:12px;
  color:var(--muted);
  line-height:1.45;
}

.istatistikler{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.istatistik{
  text-align:center;
}

.istatistik b{
  display:block;
  font-size:21px;
}

.istatistik small{
  color:var(--muted);
  font-size:10px;
}

.sekmeler{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:11px 0;
}

.sekme{
  background:#0d1726;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 11px;
  white-space:nowrap;
}

.sekme.aktif{
  background:#19394d;
  color:white;
}

.tahmin{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-top:11px;
  padding-top:11px;
  border-top:1px solid var(--line);
}

.pazar{
  font-size:16px;
  font-weight:900;
}

.yuzde{
  font-size:25px;
  font-weight:900;
}

.sinif{
  display:inline-block;
  margin-left:6px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
}

.aplus{
  background:#104934;
  color:#9cf4d0;
}

.a{
  background:#193d60;
  color:#bbddff;
}

.b{
  background:#4a3817;
  color:#ffe79c;
}

.oynama{
  background:#41242f;
  color:#ffb9c6;
}

.metrikler{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  margin-top:10px;
}

.metrik{
  background:#0b1523;
  border:1px solid #213149;
  border-radius:10px;
  padding:8px;
}

.metrik small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.metrik b{
  font-size:13px;
}

.bolum{
  margin-top:11px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.bolumBaslik{
  font-size:11px;
  font-weight:900;
  color:#bed0e6;
  margin-bottom:6px;
}

.aciklama{
  font-size:12px;
  line-height:1.55;
  color:#bdc9da;
}

.iyi{color:#8cf0c8}
.uyari{color:#ffd78b}
.kotu{color:#ff9cab}

.cubuk{
  height:6px;
  background:#07101d;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.dolgu{
  height:100%;
  background:#6ee7b7;
}

.bos{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.veriEtiketi{
  display:inline-block;
  padding:4px 7px;
  border-radius:999px;
  background:#0b2030;
  color:#9ac7e9;
  font-size:9px;
  margin-top:8px;
}

.oranGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.oranKutu{
  background:#0b1523;
  border:1px solid #26364d;
  border-radius:11px;
  padding:9px;
}

.oranKutu label{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-bottom:5px;
}

select,
input[type="number"],
input[type="text"]{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #31425d;
  background:#07101d;
  color:white;
}

.oranSatir{
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:7px;
}

.oranSatir input[type="checkbox"]{
  width:20px;
  height:20px;
}

.oranSonuc{
  margin-top:7px;
  font-size:11px;
  line-height:1.5;
}

.kuponPanel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:rgba(7,16,29,.97);
  border-top:1px solid #30415a;
  backdrop-filter:blur(16px);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}

.kuponPanelIc{
  max-width:840px;
  margin:auto;
}

.kuponOzet{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.kuponOzet .metrik{
  text-align:center;
}

.kuponDetay{
  max-height:190px;
  overflow:auto;
  margin-top:8px;
}

.kuponAyak{
  border-top:1px solid #223149;
  padding:7px 0;
  font-size:11px;
}

.kuponButonlar{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.kuponButonlar button{
  flex:1;
}

.gizli{
  display:none;
}

@media(max-width:500px){
  .istatistikler{
    grid-template-columns:repeat(4,1fr);
  }

  .oranGrid{
    grid-template-columns:1fr;
  }

  .kuponOzet{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<main>

<p class="altbaslik">
Futbol Karar Motoru • V1.3
</p>

<script>

const API =
  "https://v3.football.api-sports.io";


const LIGLER = {

  39:{
    ad:"Premier League",
    csv:"E0"
  },

  40:{
    ad:"Championship",
    csv:"E1"
  },

  78:{
    ad:"Bundesliga",
    csv:"D1"
  },

  135:{
    ad:"Serie A",
    csv:"I1"
  },

  140:{
    ad:"La Liga",
    csv:"SP1"
  },

  61:{
    ad:"Ligue 1",
    csv:"F1"
  },

  88:{
    ad:"Eredivisie",
    csv:"N1"
  },

  89:{
    ad:"Eerste Divisie",
    csv:null
  },

  203:{
    ad:"Süper Lig",
    csv:"T1"
  },

  204:{
    ad:"Türkiye 1. Lig",
    csv:null
  },

  144:{
    ad:"Jupiler Pro League",
    csv:"B1"
  },

  2:{
    ad:"Şampiyonlar Ligi",
    csv:null
  },

  3:{
    ad:"Avrupa Ligi",
    csv:null
  },

  848:{
    ad:"Konferans Ligi",
    csv:null
  }

};


let durum = {

  analizler:[],
  sekme:"gucluler",
  apiSayisi:0,
  kupon:[]

};


const $ =
  secici =>
    document.querySelector(secici);


function apiAnahtari(){

  return localStorage.getItem(
    "goalgrid_api_key"
  ) || "";

}


async function api(path){

  durum.apiSayisi++;

  $("#apiSayisi").textContent =
    durum.apiSayisi;


  const cevap =
    await fetch(
      API + path,
      {
        headers:{
          "x-apisports-key":
            apiAnahtari()
        }
      }
    );


  const veri =
    await cevap.json();


  if(
    veri.errors &&
    Object.keys(
      veri.errors
    ).length
  ){

    throw new Error(
      JSON.stringify(
        veri.errors
      )
    );

  }


  return veri.response || [];

}


function turkiyeTarihi(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Istanbul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(
    new Date()
  );

}


function csvCozumle(metin){

  const satirlar=[];

  let satir=[];
  let hucre="";
  let tirnak=false;


  for(
    let i=0;
    i<metin.length;
    i++
  ){

    const karakter =
      metin[i];


    if(
      karakter === '"'
    ){

      if(
        tirnak &&
        metin[i+1] === '"'
      ){

        hucre += '"';
        i++;

      }else{

        tirnak =
          !tirnak;

      }

    }else if(
      karakter === "," &&
      !tirnak
    ){

      satir.push(
        hucre
      );

      hucre="";

    }else if(
      (
        karakter === "\n"
        ||
        karakter === "\r"
      )
      &&
      !tirnak
    ){

      if(
        karakter === "\r"
        &&
        metin[i+1] === "\n"
      ){

        i++;

      }


      satir.push(
        hucre
      );


      if(
        satir.some(
          x => x !== ""
        )
      ){

        satirlar.push(
          satir
        );

      }


      satir=[];
      hucre="";

    }else{

      hucre +=
        karakter;

    }

  }


  if(
    hucre ||
    satir.length
  ){

    satir.push(
      hucre
    );

    satirlar.push(
      satir
    );

  }


  if(
    satirlar.length < 2
  ){

    return [];

  }


  const basliklar =
    satirlar[0].map(
      x => x.trim()
    );


  return satirlar
    .slice(1)
    .map(
      satir => {

        const nesne={};


        basliklar.forEach(
          (baslik,index) => {

            nesne[baslik] =
              (
                satir[index]
                ?? ""
              ).trim();

          }
        );


        return nesne;

      }
    );

}


async function csvYukle(kod){

  const onbellekAnahtari =
    "goalgrid_csv_v13_"
    + kod;


  const kayit =
    localStorage.getItem(
      onbellekAnahtari
    );


  if(kayit){

    try{

      const veri =
        JSON.parse(
          kayit
        );


      if(
        Date.now() -
        veri.zaman
        <
        30 * 60 * 1000
      ){

        return veri.satirlar;

      }

    }catch{}

  }


  const cevap =
    await fetch(
      `/csv?code=${encodeURIComponent(kod)}`
    );


  if(
    !cevap.ok
  ){

    throw new Error(
      `CSV ${kod} alınamadı`
    );

  }


  const metin =
    await cevap.text();


  const satirlar =
    csvCozumle(
      metin
    );


  localStorage.setItem(
    onbellekAnahtari,
    JSON.stringify({
      zaman:
        Date.now(),

      satirlar
    })
  );


  return satirlar;

}


function norm(deger){

  return String(
    deger || ""
  )
  .toLocaleLowerCase("tr")
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .replace(
    /[^a-z0-9]/g,
    ""
  );

}


const TAKIM_ESLESTIRME = {

  manchesterunited:
    "manunited",

  manchestercity:
    "mancity",

  tottenhamhotspur:
    "tottenham",

  wolverhamptonwanderers:
    "wolves",

  nottinghamforest:
    "nottmforest",

  internazionale:
    "inter",

  parissaintgermain:
    "psg",

  atleticomadrid:
    "athmadrid",

  caykurrizespor:
    "rizespor",

  gaziantepfk:
    "gaziantep",

  istanbulbasaksehir:
    "basaksehir",

  esenlererokspor:
    "erokspor"

};


function takimAnahtari(ad){

  const n =
    norm(ad);


  return(
    TAKIM_ESLESTIRME[n]
    ||
    n
  );

}


function ayniTakim(
  birinci,
  ikinci
){

  const a =
    takimAnahtari(
      birinci
    );


  const b =
    takimAnahtari(
      ikinci
    );


  if(
    !a ||
    !b
  ){

    return false;

  }


  if(
    a === b
  ){

    return true;

  }


  return(
    (
      a.length >= 5
      &&
      b.includes(a)
    )
    ||
    (
      b.length >= 5
      &&
      a.includes(b)
    )
  );

}


function sayi(deger){

  const n =
    parseFloat(
      deger
    );


  return(
    Number.isFinite(n)
    ? n
    : null
  );

}


function tamamlanmis(satir){

  return(
    satir.HomeTeam
    &&
    satir.AwayTeam
    &&
    sayi(
      satir.FTHG
    ) !== null
    &&
    sayi(
      satir.FTAG
    ) !== null
  );

}


function sonMaclar(
  takim,
  satirlar,
  saha=null
){

  let liste =
    satirlar.filter(
      satir =>

        tamamlanmis(
          satir
        )

        &&

        (
          ayniTakim(
            takim,
            satir.HomeTeam
          )

          ||

          ayniTakim(
            takim,
            satir.AwayTeam
          )
        )

    );


  if(
    saha === "ic"
  ){

    liste =
      liste.filter(
        satir =>
          ayniTakim(
            takim,
            satir.HomeTeam
          )
      );

  }


  if(
    saha === "dis"
  ){

    liste =
      liste.filter(
        satir =>
          ayniTakim(
            takim,
            satir.AwayTeam
          )
      );

  }


  return liste
    .slice(-10)
    .reverse();

}


function formHesapla(
  takim,
  maclar
){

  if(
    !maclar.length
  ){

    return{
      adet:0,
      attigi:0,
      yedigi:0,
      puanOrt:0,
      kgVar:0,
      ust15:0,
      ust25:0,
      sut:null,
      isabetliSut:null,
      korner:null,
      kart:null,
      oynaklik:0
    };

  }


  let attigi=0;
  let yedigi=0;
  let puan=0;
  let agirlikToplam=0;

  let kgVar=0;
  let ust15=0;
  let ust25=0;

  let sut=0;
  let sutAdet=0;

  let isabetliSut=0;
  let isabetliSutAdet=0;

  let korner=0;
  let kornerAdet=0;

  let kart=0;
  let kartAdet=0;

  const toplamGoller=[];


  maclar.forEach(
    (satir,index) => {

      const evSahibi =
        ayniTakim(
          takim,
          satir.HomeTeam
        );


      const atti =
        evSahibi
        ? sayi(
            satir.FTHG
          )
        : sayi(
            satir.FTAG
          );


      const yedi =
        evSahibi
        ? sayi(
            satir.FTAG
          )
        : sayi(
            satir.FTHG
          );


      const agirlik =
        Math.pow(
          .90,
          index
        );


      attigi +=
        atti * agirlik;


      yedigi +=
        yedi * agirlik;


      if(
        atti > yedi
      ){

        puan +=
          3 * agirlik;

      }else if(
        atti === yedi
      ){

        puan +=
          1 * agirlik;

      }


      agirlikToplam +=
        agirlik;


      if(
        atti > 0
        &&
        yedi > 0
      ){

        kgVar++;

      }


      if(
        atti + yedi >= 2
      ){

        ust15++;

      }


      if(
        atti + yedi >= 3
      ){

        ust25++;

      }


      toplamGoller.push(
        atti +
        yedi
      );


      const s =
        evSahibi
        ? sayi(
            satir.HS
          )
        : sayi(
            satir.AS
          );


      if(
        s !== null
      ){

        sut += s;
        sutAdet++;

      }


      const is =
        evSahibi
        ? sayi(
            satir.HST
          )
        : sayi(
            satir.AST
          );


      if(
        is !== null
      ){

        isabetliSut += is;
        isabetliSutAdet++;

      }


      const k =
        evSahibi
        ? sayi(
            satir.HC
          )
        : sayi(
            satir.AC
          );


      if(
        k !== null
      ){

        korner += k;
        kornerAdet++;

      }


      const sari =
        evSahibi
        ? sayi(
            satir.HY
          )
        : sayi(
            satir.AY
          );


      const kirmizi =
        evSahibi
        ? sayi(
            satir.HR
          )
        : sayi(
            satir.AR
          );


      if(
        sari !== null
        ||
        kirmizi !== null
      ){

        kart +=
          (sari || 0)
          +
          (kirmizi || 0) * 2;

        kartAdet++;

      }

    }
  );


  const ortalamaGol =
    toplamGoller.reduce(
      (a,b)=>a+b,
      0
    )
    /
    toplamGoller.length;


  const varyans =
    toplamGoller.reduce(
      (toplam,deger) =>
        toplam
        +
        Math.pow(
          deger -
          ortalamaGol,
          2
        ),
      0
    )
    /
    toplamGoller.length;


  return{

    adet:
      maclar.length,

    attigi:
      attigi /
      agirlikToplam,

    yedigi:
      yedigi /
      agirlikToplam,

    puanOrt:
      puan /
      agirlikToplam,

    kgVar:
      kgVar /
      maclar.length,

    ust15:
      ust15 /
      maclar.length,

    ust25:
      ust25 /
      maclar.length,

    sut:
      sutAdet
      ? sut /
        sutAdet
      : null,

    isabetliSut:
      isabetliSutAdet
      ? isabetliSut /
        isabetliSutAdet
      : null,

    korner:
      kornerAdet
      ? korner /
        kornerAdet
      : null,

    kart:
      kartAdet
      ? kart /
        kartAdet
      : null,

    oynaklik:
      varyans

  };

}


function poisson(
  gol,
  beklenen
){

  let faktoriyel=1;


  for(
    let i=2;
    i<=gol;
    i++
  ){

    faktoriyel *= i;

  }


  return(
    Math.exp(
      -beklenen
    )
    *
    Math.pow(
      beklenen,
      gol
    )
    /
    faktoriyel
  );

}


function pazarOlasiliklari(
  evBeklenen,
  depBeklenen
){

  let ev=0;
  let beraberlik=0;
  let dep=0;

  let kgVar=0;
  let ust15=0;
  let ust25=0;
  let ust35=0;


  for(
    let evGol=0;
    evGol<=8;
    evGol++
  ){

    for(
      let depGol=0;
      depGol<=8;
      depGol++
    ){

      const p =
        poisson(
          evGol,
          evBeklenen
        )
        *
        poisson(
          depGol,
          depBeklenen
        );


      if(
        evGol >
        depGol
      ){

        ev += p;

      }else if(
        evGol ===
        depGol
      ){

        beraberlik += p;

      }else{

        dep += p;

      }


      if(
        evGol > 0
        &&
        depGol > 0
      ){

        kgVar += p;

      }


      if(
        evGol +
        depGol >= 2
      ){

        ust15 += p;

      }


      if(
        evGol +
        depGol >= 3
      ){

        ust25 += p;

      }


      if(
        evGol +
        depGol >= 4
      ){

        ust35 += p;

      }

    }

  }


  return{
    ev,
    beraberlik,
    dep,
    kgVar,
    ust15,
    ust25,
    ust35
  };

}


function karistir(
  model,
  tarihsel,
  modelAgirligi=.72
){

  return(
    model *
    modelAgirligi
    +
    tarihsel *
    (
      1-modelAgirligi
    )
  );

}


function veriKalitesi(
  evAdet,
  depAdet,
  gelismisVeri
){

  const adet =
    Math.min(
      evAdet,
      depAdet
    );


  let puan=10;


  if(
    adet >= 10
  ){

    puan=95;

  }else if(
    adet >= 8
  ){

    puan=88;

  }else if(
    adet >= 6
  ){

    puan=78;

  }else if(
    adet >= 4
  ){

    puan=63;

  }else if(
    adet >= 2
  ){

    puan=42;

  }


  if(
    gelismisVeri
  ){

    puan += 5;

  }


  return Math.min(
    100,
    puan
  );

}


function siniflandir(
  puan,
  veriPuani
){

  if(
    veriPuani < 45
  ){

    return[
      "OYNAMA",
      "oynama"
    ];

  }


  if(
    puan >= 88
  ){

    return[
      "A+",
      "aplus"
    ];

  }


  if(
    puan >= 81
  ){

    return[
      "A",
      "a"
    ];

  }


  if(
    puan >= 72
  ){

    return[
      "B",
      "b"
    ];

  }


  return[
    "OYNAMA",
    "oynama"
  ];

}


function analizEt(
  mac,
  satirlar,
  kaynak
){

  const ev =
    mac.teams.home.name;


  const dep =
    mac.teams.away.name;


  const evSon =
    sonMaclar(
      ev,
      satirlar
    );


  const depSon =
    sonMaclar(
      dep,
      satirlar
    );


  const evIc =
    sonMaclar(
      ev,
      satirlar,
      "ic"
    );


  const depDis =
    sonMaclar(
      dep,
      satirlar,
      "dis"
    );


  const evForm =
    formHesapla(
      ev,
      evSon
    );


  const depForm =
    formHesapla(
      dep,
      depSon
    );


  const evIcForm =
    formHesapla(
      ev,
      evIc
    );


  const depDisForm =
    formHesapla(
      dep,
      depDis
    );


  const gelismisVeri =
    (
      evForm.sut !== null
      ||
      depForm.sut !== null
    );


  const veriPuani =
    veriKalitesi(
      evForm.adet,
      depForm.adet,
      gelismisVeri
    );


  if(
    evForm.adet < 2
    ||
    depForm.adet < 2
  ){

    return{

      mac,

      sinif:
        "OYNAMA",

      sinifCss:
        "oynama",

      anaPazar:
        "VERİ YETERSİZ",

      anaOlasilik:
        0,

      puan:
        0,

      veriPuani,

      oynama:
        false,

      kaynak,

      neden:
        "Takımlardan biri için yeterli geçmiş maç bulunamadı."

    };

  }


  const evAttigi =
    evIcForm.adet >= 3
    ? karistir(
        evIcForm.attigi,
        evForm.attigi,
        .65
      )
    : evForm.attigi;


  const evYedigi =
    evIcForm.adet >= 3
    ? karistir(
        evIcForm.yedigi,
        evForm.yedigi,
        .65
      )
    : evForm.yedigi;


  const depAttigi =
    depDisForm.adet >= 3
    ? karistir(
        depDisForm.attigi,
        depForm.attigi,
        .65
      )
    : depForm.attigi;


  const depYedigi =
    depDisForm.adet >= 3
    ? karistir(
        depDisForm.yedigi,
        depForm.yedigi,
        .65
      )
    : depForm.yedigi;


  let evBeklenen =
    .46 *
    evAttigi
    +
    .34 *
    depYedigi
    +
    .20 *
    1.42;


  let depBeklenen =
    .46 *
    depAttigi
    +
    .34 *
    evYedigi
    +
    .20 *
    1.18;


  if(
    evForm.isabetliSut !== null
    &&
    depForm.isabetliSut !== null
  ){

    const sutFarki =
      (
        evForm.isabetliSut
        -
        depForm.isabetliSut
      )
      *
      .025;


    evBeklenen +=
      sutFarki;


    depBeklenen -=
      sutFarki *
      .40;

  }


  evBeklenen =
    Math.max(
      .25,
      Math.min(
        3.6,
        evBeklenen
      )
    );


  depBeklenen =
    Math.max(
      .20,
      Math.min(
        3.4,
        depBeklenen
      )
    );


  const poissonSonuc =
    pazarOlasiliklari(
      evBeklenen,
      depBeklenen
    );


  const tarihsel = {

    kgVar:
      (
        evForm.kgVar
        +
        depForm.kgVar
      )
      /
      2,

    ust15:
      (
        evForm.ust15
        +
        depForm.ust15
      )
      /
      2,

    ust25:
      (
        evForm.ust25
        +
        depForm.ust25
      )
      /
      2

  };


  const pazarlar = {

    "1.5 Üst":
      karistir(
        poissonSonuc.ust15,
        tarihsel.ust15
      ),

    "2.5 Üst":
      karistir(
        poissonSonuc.ust25,
        tarihsel.ust25
      ),

    "KG Var":
      karistir(
        poissonSonuc.kgVar,
        tarihsel.kgVar
      ),

    "1X":
      poissonSonuc.ev
      +
      poissonSonuc.beraberlik,

    "X2":
      poissonSonuc.dep
      +
      poissonSonuc.beraberlik,

    "Ev Sahibi":
      poissonSonuc.ev,

    "Deplasman":
      poissonSonuc.dep,

    "3.5 Üst":
      poissonSonuc.ust35

  };


  const sirali =
    Object.entries(
      pazarlar
    )
    .map(
      ([ad,olasilik]) => ({
        ad,
        olasilik
      })
    )
    .sort(
      (a,b) =>
        b.olasilik -
        a.olasilik
    );


  const ana =
    sirali[0];


  const alternatif =
    sirali[1];


  const uyum =
    100
    -
    Math.min(
      100,

      Math.abs(
        poissonSonuc.ust25
        -
        tarihsel.ust25
      )
      *
      135

      +

      Math.abs(
        poissonSonuc.kgVar
        -
        tarihsel.kgVar
      )
      *
      90
    );


  const oynaklik =
    Math.min(
      100,

      (
        (
          evForm.oynaklik
          +
          depForm.oynaklik
        )
        /
        2
      )
      *
      23
    );


  let toplamPuan =
    ana.olasilik
    *
    100;


  toplamPuan +=
    veriPuani
    *
    .06;


  toplamPuan +=
    uyum
    *
    .045;


  toplamPuan -=
    oynaklik
    *
    .035;


  if(
    evForm.adet < 4
    ||
    depForm.adet < 4
  ){

    toplamPuan -= 6;

  }


  toplamPuan =
    Math.round(
      Math.max(
        0,
        Math.min(
          96,
          toplamPuan
        )
      )
    );


  const sinif =
    siniflandir(
      toplamPuan,
      veriPuani
    );


  const riskler=[];


  if(
    veriPuani < 70
  ){

    riskler.push(
      "Veri örneklemi sınırlı"
    );

  }


  if(
    oynaklik >= 65
  ){

    riskler.push(
      "Skor oynaklığı yüksek"
    );

  }


  if(
    evForm.adet < 5
    ||
    depForm.adet < 5
  ){

    riskler.push(
      "Sezon başı belirsizliği"
    );

  }


  return{

    mac,

    evBeklenen,
    depBeklenen,

    pazarlar,

    evForm,
    depForm,

    puan:
      toplamPuan,

    sinif:
      sinif[0],

    sinifCss:
      sinif[1],

    anaPazar:
      ana.ad,

    anaOlasilik:
      ana.olasilik,

    alternatif,

    veriPuani:
      Math.round(
        veriPuani
      ),

    uyum:
      Math.round(
        uyum
      ),

    oynaklik:
      Math.round(
        oynaklik
      ),

    riskler,

    kaynak,

    oynama:
      sinif[0] !==
      "OYNAMA"

  };

}

  return{

async function tara(
  zorla=false
){

  if(
    !apiAnahtari()
  ){

    alert(
      "API anahtarı bulunamadı."
    );

    return;

  }


  durum.apiSayisi=0;

  $("#apiSayisi").textContent=
    "0";


  const tarih =
    turkiyeTarihi();


  const onbellek =
    "goalgrid_v13_"
    +
    tarih;


  const kayit =
    localStorage.getItem(
      onbellek
    );


  if(
    kayit
    &&
    !zorla
  ){

    try{

      const veri =
        JSON.parse(
          kayit
        );


      if(
        Date.now()
        -
        veri.zaman
        <
        2 * 60 * 60 * 1000
      ){

        durum.analizler =
          veri.analizler || [];


        ekraniCiz();


        $("#taramaDurumu").textContent =
          "✓ Analiz telefon hafızasından açıldı. API kotası kullanılmadı.";


        return;

      }

    }catch{}

  }


  $("#taramaDurumu").textContent =
    "Bugünün maçları alınıyor…";


  try{

    const fikstur =
      await api(
        `/fixtures?date=${tarih}&timezone=Europe/Istanbul`
      );


    const maclar =
      fikstur.filter(
        mac =>
          Boolean(
            LIGLER[
              mac.league.id
            ]
          )
      );


    if(
      !maclar.length
    ){

      durum.analizler=[];

      ekraniCiz();


      $("#taramaDurumu").textContent =
        "Bugün seçili liglerde maç bulunamadı.";


      return;

    }


    const csvKodlari =
      [
        ...new Set(
          maclar
            .map(
              mac =>
                LIGLER[
                  mac.league.id
                ].csv
            )
            .filter(Boolean)
        )
      ];


    $("#taramaDurumu").textContent =
      `${maclar.length} maç bulundu. Geçmiş veriler alınıyor…`;


    const havuzlar={};


    for(
      const kod
      of csvKodlari
    ){

      try{

        havuzlar[kod] =
          await csvYukle(
            kod
          );

      }catch(hata){

        havuzlar[kod]=[];

      }

    }


    durum.analizler =
      maclar
        .map(
          mac => {

            const ayar =
              LIGLER[
                mac.league.id
              ];


            if(
              !ayar.csv
            ){

              return desteklenmeyen(
                mac
              );

            }


            const satirlar =
              havuzlar[
                ayar.csv
              ] || [];


            if(
              !satirlar.length
            ){

              return{

                ...desteklenmeyen(
                  mac
                ),

                anaPazar:
                  "VERİ KAYNAĞINA ERİŞİLEMEDİ",

                neden:
                  `${ayar.ad} geçmiş verisi alınamadı.`

              };

            }


            return analizEt(
              mac,
              satirlar,
              `Football-Data ${ayar.csv}`
            );

          }
        )
        .sort(
          (a,b) =>
            b.puan -
            a.puan
        );


    localStorage.setItem(
      onbellek,
      JSON.stringify({
        zaman:
          Date.now(),

        analizler:
          durum.analizler
      })
    );


    ekraniCiz();


    $("#taramaDurumu").textContent =
      `✓ ${maclar.length} maç işlendi • ${durum.apiSayisi} API çağrısı.`;


  }catch(hata){

    $("#taramaDurumu").textContent =
      "Hata: "
      +
      hata.message;

  }

}

function pazarOlasiligi(
  analiz,
  pazar
){

  return(
    analiz.pazarlar?.[
      pazar
    ]
    ??
    0
  );

}


function oranDegerlendir(
  analizIndex,
  pazar,
  tur
){

  const analiz =
    durum.analizler[
      analizIndex
    ];


  const siteElement =
    $(
      `#site_${tur}_${analizIndex}_${kodla(pazar)}`
    );


  const oranElement =
    $(
      `#oran_${tur}_${analizIndex}_${kodla(pazar)}`
    );


  const sonucElement =
    $(
      `#oranSonuc_${tur}_${analizIndex}_${kodla(pazar)}`
    );


  const oran =
    parseFloat(
      oranElement.value
    );


  if(
    !Number.isFinite(oran)
    ||
    oran <= 1
  ){

    sonucElement.innerHTML =
      "Geçerli bir oran gir.";

    return;

  }


  const site =
    tur === "yurtdisi"
    ? "Jojobet"
    : siteElement.value;


  const modelOlasilik =
    pazarOlasiligi(
      analiz,
      pazar
    );


  const piyasaOlasilik =
    1 / oran;


  const adilOran =
    modelOlasilik > 0
    ? 1 / modelOlasilik
    : null;


  const farkPuan =
    (
      modelOlasilik
      -
      piyasaOlasilik
    )
    *
    100;


  const degerYuzdesi =
    (
      oran *
      modelOlasilik
      -
      1
    )
    *
    100;


  let sinif =
    "Değer yok";


  if(
    degerYuzdesi >= 10
  ){

    sinif =
      "Güçlü değer";

  }else if(
    degerYuzdesi >= 5
  ){

    sinif =
      "Değerli";

  }else if(
    degerYuzdesi >= 1
  ){

    sinif =
      "Sınırlı değer";

  }


  sonucElement.innerHTML =
    `
    Model: %${Math.round(modelOlasilik*100)}
    • Piyasa: %${Math.round(piyasaOlasilik*100)}
    • Adil oran: ${adilOran?adilOran.toFixed(2):"—"}
    • Olasılık farkı: ${farkPuan>=0?"+":""}${farkPuan.toFixed(1)} puan
    • Değer: ${degerYuzdesi>=0?"+":""}${degerYuzdesi.toFixed(1)}%
    • <b>${sinif}</b>
    `;


  oranKaydiEkle({

    zaman:
      new Date().toISOString(),

    macId:
      analiz.mac.fixture.id,

    lig:
      analiz.mac.league.name,

    ev:
      analiz.mac.teams.home.name,

    dep:
      analiz.mac.teams.away.name,

    pazar,

    tur,

    site,

    oran,

    modelOlasilik,

    adilOran,

    farkPuan,

    degerYuzdesi,

    goalGridPuani:
      analiz.puan

  });

}

  );

function kuponSecimiDegisti(
  analizIndex,
  pazar,
  tur
){

  const kutu =
    $(
      `#kupon_${tur}_${analizIndex}_${kodla(pazar)}`
    );


  const analiz =
    durum.analizler[
      analizIndex
    ];

    $(
      `#oran_${tur}_${analizIndex}_${kodla(pazar)}`
    );


  const oran =
    parseFloat(
      oranElement.value
    );


  if(
    kutu.checked
    &&
    (
      !Number.isFinite(oran)
      ||
      oran <= 1
    )
  ){

    alert(
      "Önce oranı gir."
    );

    kutu.checked=false;

    return;

  }


  const site =
    tur === "yurtdisi"
    ? "Jojobet"
    : $(
        `#site_${tur}_${analizIndex}_${kodla(pazar)}`
      ).value;


  const mevcutAyniMac =
    durum.kupon.find(

    );

      );


    if(
      !devam
    ){

      kutu.checked=false;

      return;

    }

  }


  const anahtar =
    `${analiz.mac.fixture.id}_${pazar}_${tur}_${site}`;


  if(
    kutu.checked
  ){

    durum.kupon.push({

      anahtar,

      macId:
        analiz.mac.fixture.id,

      mac:
        `${analiz.mac.teams.home.name} - ${analiz.mac.teams.away.name}`,

      pazar,

      tur,

      site,

      oran,

      goalGridPuani:
        analiz.puan,

      modelOlasilik:
        pazarOlasiligi(
          analiz,
          pazar
        )

    });

  }else{

    durum.kupon =
      durum.kupon.filter(
        secim =>
          secim.anahtar !==
          anahtar
      );

  }


  kuponuGuncelle();

}


function kuponuGuncelle(){

  const panel =
    $("#kuponPanel");


  if(
    !durum.kupon.length
  ){

    panel.classList.add(
      "gizli"
    );

    return;

  }


  panel.classList.remove(
    "gizli"
  );


  let toplamOran=1;
  let puanToplam=0;
  let enDusuk=100;
  let birlesik=1;


  durum.kupon.forEach(
    secim => {

      toplamOran *=
        secim.oran;


      puanToplam +=
        secim.goalGridPuani;


      enDusuk =
        Math.min(
          enDusuk,
          secim.goalGridPuani
        );


      birlesik *=
        secim.modelOlasilik;

    }
  );


  const ortalama =
    puanToplam /
    durum.kupon.length;


  $("#kuponSecimSayisi").textContent =
    `${durum.kupon.length} seçim`;


  $("#toplamOran").textContent =
    toplamOran.toFixed(2);


  $("#ortalamaGuven").textContent =
    Math.round(
      ortalama
    )
    +
    "/100";


  $("#enDusukGuven").textContent =
    enDusuk
    +
    "/100";


  $("#birlesikOlasilik").textContent =
    "%"
    +
    (
      birlesik *
      100
    ).toFixed(1);


  $("#kuponDetay").innerHTML =
    durum.kupon
      .map(
        secim =>
          `
          <div class="kuponAyak">

            <b>
              ${secim.mac}
            </b>

            <div class="durum">
              ${secim.pazar}
              •
              ${secim.site}
              @
              ${secim.oran.toFixed(2)}
              •
              GoalGrid ${secim.goalGridPuani}/100
            </div>

          </div>
          `
      )
      .join("");


  const yatirilan =
    parseFloat(
      $("#yatirilan")?.value
    )
    ||
    0;


  $("#potansiyelDonus").textContent =
    (
      yatirilan *
      toplamOran
    ).toLocaleString(
      "tr-TR",
      {
        maximumFractionDigits:2
      }
    )
    +
    " TL";

}


function kuponuAcKapat(){

  $("#kuponAyrinti")
    .classList
    .toggle(
      "gizli"
    );

}


function kuponuTemizle(){

  durum.kupon=[];


  document
    .querySelectorAll(
      'input[type="checkbox"]'
    )
    .forEach(
      kutu =>
        kutu.checked=false
    );


  kuponuGuncelle();

}


function kuponlariOku(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "goalgrid_kupon_gecmisi"
      )
    ) || [];

  }catch{

    return [];

  }

}


function kuponuKaydet(){

  if(
    !durum.kupon.length
  ){

    return;

  }


  let toplamOran=1;


  durum.kupon.forEach(
    secim =>
      toplamOran *=
      secim.oran
  );


  const kasa =
    parseFloat(
      $("#kasa").value
    )
    ||
    0;


  const yatirilan =
    parseFloat(
      $("#yatirilan").value
    )
    ||
    0;


  const kayit = {

    kimlik:
      Date.now(),

    zaman:
      new Date().toISOString(),

    kasa,

    yatirilan,

    toplamOran,

    potansiyel:
      yatirilan *
      toplamOran,

    secimler:
      [...durum.kupon],

    durum:
      "Bekliyor"

  };


  const kuponlar =
    kuponlariOku();


  kuponlar.unshift(
    kayit
  );


  localStorage.setItem(
    "goalgrid_kupon_gecmisi",
    JSON.stringify(
      kuponlar
    )
  );


  alert(
    "Kupon kaydedildi."
  );

}

function kayitliKuponlariCiz(){

  const kuponlar =
    kuponlariOku();


  if(
    !kuponlar.length
  ){

    $("#icerik").innerHTML =
      `
      <div class="bos">
        Henüz kayıtlı kupon yok.
      </div>
      `;

    return;

  }


  $("#icerik").innerHTML =
    kuponlar
      .map(
        kupon =>
          `
          <section class="kart">

            <div class="ustSatir">

              <div>

                <b>
                  ${new Date(kupon.zaman).toLocaleString("tr-TR")}
                </b>

                <div class="durum">
                  ${kupon.secimler.length} seçim
                </div>

              </div>

              <div>
                <b>
                  ${kupon.toplamOran.toFixed(2)}
                </b>
              </div>

            </div>


            <div class="bolum">

              ${
                kupon.secimler
                  .map(
                    secim =>
                      `
                      <div class="kuponAyak">

                        <b>
                          ${secim.mac}
                        </b>

                        <div class="durum">
                          ${secim.pazar}
                          •
                          ${secim.site}
                          @
                          ${secim.oran.toFixed(2)}
                        </div>

                      </div>
                      `
                  )
                  .join("")
              }

            </div>


            <div class="metrikler">

              <div class="metrik">

                <small>
                  Yatırılan
                </small>

                <b>
                  ${kupon.yatirilan.toLocaleString("tr-TR")} TL
                </b>

              </div>


              <div class="metrik">

                <small>
                  Potansiyel Dönüş
                </small>

                <b>
                  ${kupon.potansiyel.toLocaleString("tr-TR")} TL
                </b>

              </div>

            </div>

          </section>
          `
      )
      .join("");

}


function ekraniCiz(){

  $("#macSayisi").textContent =
    durum.analizler.length;


  $("#gucluSayisi").textContent =
    durum.analizler.filter(
      analiz =>
        analiz.sinif === "A"
        ||
        analiz.sinif === "A+"
    ).length;


  $("#oynamaSayisi").textContent =
    durum.analizler.filter(
      analiz =>
        analiz.sinif === "OYNAMA"
    ).length;


  if(
    durum.sekme === "kuponlar"
  ){

    kayitliKuponlariCiz();

    return;

  }


  let liste =
    [...durum.analizler];


  if(
    durum.sekme === "gucluler"
  ){

    liste =
      liste.filter(
        analiz =>
          analiz.sinif === "A"
          ||
          analiz.sinif === "A+"
      );

  }


  if(
    !liste.length
  ){

    $("#icerik").innerHTML =
      `
      <div class="bos">
        Bu kategoride maç bulunmuyor.
      </div>
      `;

    return;

  }


  $("#icerik").innerHTML =
    liste
      .map(
        analiz =>
          macKarti(
            analiz,
            durum.analizler.indexOf(
              analiz
            )
          )
      )
      .join("");

}


document
.querySelectorAll(
  ".sekme"

.forEach(

        document

        dugme.classList.add(

        durum.sekme =

        ekraniCiz();
