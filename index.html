<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GoalGrid</title>

<style>
body{
 margin:0;background:#07101d;color:#eef4ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
main{max-width:700px;margin:auto;padding:30px 16px}
h1{font-size:34px;margin:0}
.sub{color:#8fa1b9}
.card{
 background:#101b2b;border:1px solid #24324a;
 border-radius:18px;padding:16px;margin:14px 0
}
input{
 width:100%;box-sizing:border-box;padding:13px;
 border-radius:12px;border:1px solid #31425d;
 background:#07101d;color:white;margin:8px 0
}
button{
 padding:12px 15px;border:0;border-radius:12px;
 background:#6ee7b7;color:#052218;font-weight:800
}
.league,.match{
 padding:10px 0;border-bottom:1px solid #24324a
}
.muted{color:#8fa1b9;font-size:12px}
</style>
</head>

<body>
<main>

<h1>⚽ GoalGrid</h1>
<p class="sub">Kişisel Futbol Analiz Sistemi • V0.2</p>

<section class="card">
<h2>API Bağlantısı</h2>

<input id="key" type="password" placeholder="API-Football Key">

<button onclick="saveKey()">Anahtarı Kaydet</button>

<p id="status" class="muted">
Anahtar yalnızca bu telefonda saklanır.
</p>
</section>

<section class="card">
<h2>Bugünün Maçları</h2>

<button onclick="loadMatches()">⚽ Maçları Tara</button>

<div id="matches"></div>
</section>

<section class="card">
<h2>Takip Edilen Ligler</h2>

<div id="leagues"></div>
</section>

<script>

const leagues=[
["Premier League",39],
["Championship",40],
["Bundesliga",78],
["Serie A",135],
["La Liga",140],
["Ligue 1",61],
["Eredivisie",88],
["Eerste Divisie",89],
["Türkiye Süper Lig",203],
["Türkiye 1. Lig",204],
["Belçika Jupiler Pro League",144],
["Şampiyonlar Ligi",2],
["Avrupa Ligi",3],
["Konferans Ligi",848]
];

document.querySelector("#leagues").innerHTML=
leagues.map(x=>`<div class="league">✓ ${x[0]}</div>`).join("");

document.querySelector("#key").value=
localStorage.getItem("ggkey")||"";

function saveKey(){

 const key=document.querySelector("#key").value.trim();

 localStorage.setItem("ggkey",key);

 document.querySelector("#status").textContent=
 "✓ API anahtarı kaydedildi.";

}

async function loadMatches(){

 const key=localStorage.getItem("ggkey");

 if(!key){
   alert("Önce API anahtarını kaydet.");
   return;
 }

 const d=new Date().toISOString().slice(0,10);

 const box=document.querySelector("#matches");

 box.innerHTML='<p class="muted">Maçlar taranıyor…</p>';

 try{

 const r=await fetch(
 `https://v3.football.api-sports.io/fixtures?date=${d}&timezone=Europe/Istanbul`,
 {
 headers:{
 "x-apisports-key":key
 }
 });

 const j=await r.json();

 const ids=new Set(leagues.map(x=>x[1]));

 const games=(j.response||[])
 .filter(x=>ids.has(x.league.id));

 if(!games.length){

 box.innerHTML=
 '<p class="muted">Bugün seçili liglerde maç bulunamadı.</p>';

 return;

 }

 box.innerHTML=games.map(x=>{

 const time=new Date(x.fixture.date)
 .toLocaleTimeString("tr-TR",{
 hour:"2-digit",
 minute:"2-digit"
 });

 return `
 <div class="match">

 <b>
 ${x.teams.home.name}
 —
 ${x.teams.away.name}
 </b>

 <div class="muted">
 ${x.league.name} • ${time}
 </div>

 </div>
 `;

 }).join("");

 }catch(e){

 box.innerHTML=
 '<p class="muted">Veri alınamadı: '+e.message+'</p>';

 }

}

</script>

</main>
</body>
</html>
