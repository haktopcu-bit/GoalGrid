<script>

const API =
  "https://v3.football.api-sports.io";


const LEAGUES = {

  39:{
    name:"Premier League",
    csv:"E0"
  },

  40:{
    name:"Championship",
    csv:"E1"
  },

  78:{
    name:"Bundesliga",
    csv:"D1"
  },

  135:{
    name:"Serie A",
    csv:"I1"
  },

  140:{
    name:"La Liga",
    csv:"SP1"
  },

  61:{
    name:"Ligue 1",
    csv:"F1"
  },

  88:{
    name:"Eredivisie",
    csv:"N1"
  },

  89:{
    name:"Eerste Divisie",
    csv:null
  },

  203:{
    name:"Süper Lig",
    csv:"T1"
  },

  204:{
    name:"Türkiye 1. Lig",
    csv:null
  },

  144:{
    name:"Jupiler Pro League",
    csv:"B1"
  },

  2:{
    name:"Şampiyonlar Ligi",
    csv:null
  },

  3:{
    name:"Avrupa Ligi",
    csv:null
  },

  848:{
    name:"Konferans Ligi",
    csv:null
  }

};


let state = {

  analyses:[],
  tab:"best",
  calls:0,
  csvPools:{}

};


const $ = s =>
  document.querySelector(s);


function apiKey(){

  return localStorage.getItem(
    "goalgrid_api_key"
  ) || "";

}


async function api(path){

  state.calls++;

  $("#calls").textContent =
    state.calls;

  const response =
    await fetch(
      API + path,
      {
        headers:{
          "x-apisports-key":apiKey()
        }
      }
    );

  const data =
    await response.json();

  if(
    data.errors &&
    Object.keys(data.errors).length
  ){

    throw new Error(
      JSON.stringify(data.errors)
    );

  }

  return data.response || [];

}


function trDate(){

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Europe/Istanbul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(
    new Date()
  );

}


function parseCSV(text){

  const rows = [];

  let row = [];
  let cell = "";
  let quote = false;


  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c = text[i];


    if(c === '"'){

      if(
        quote &&
        text[i+1] === '"'
      ){

        cell += '"';
        i++;

      }else{

        quote = !quote;

      }

    }else if(
      c === "," &&
      !quote
    ){

      row.push(cell);
      cell = "";

    }else if(
      (c === "\n" || c === "\r") &&
      !quote
    ){

      if(
        c === "\r" &&
        text[i+1] === "\n"
      ){
        i++;
      }

      row.push(cell);

      if(
        row.some(
          x => x !== ""
        )
      ){
        rows.push(row);
      }

      row = [];
      cell = "";

    }else{

      cell += c;

    }

  }


  if(
    cell ||
    row.length
  ){

    row.push(cell);
    rows.push(row);

  }


  if(rows.length < 2){
    return [];
  }


  const headers =
    rows[0].map(
      x => x.trim()
    );


  return rows
    .slice(1)
    .map(r => {

      const obj = {};

      headers.forEach(
        (h,i) => {

          obj[h] =
            (r[i] ?? "").trim();

        }
      );

      return obj;

    });

}


async function loadCSV(code){

  const cacheKey =
    "goalgrid_csv_" + code;


  const cached =
    localStorage.getItem(
      cacheKey
    );


  if(cached){

    try{

      const parsed =
        JSON.parse(cached);


      if(
        Date.now() -
        parsed.time
        <
        30 * 60 * 1000
      ){

        return parsed.rows;

      }

    }catch{}

  }


  const response =
    await fetch(
      `/csv?code=${code}`
    );


  if(!response.ok){

    throw new Error(
      `CSV ${code} alınamadı (${response.status})`
    );

  }


  const text =
    await response.text();


  const rows =
    parseCSV(text);


  localStorage.setItem(
    cacheKey,
    JSON.stringify({
      time:Date.now(),
      rows
    })
  );


  return rows;

}


function norm(s){

  return (s || "")
    .toLocaleLowerCase("tr")
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^a-z0-9]/g,
      ""
    );

}


const ALIASES = {

  manchesterunited:
    "manunited",

  manchestercity:
    "mancity",

  tottenhamhotspur:
    "tottenham",

  wolverhamptonwanderers:
    "wolves",

  nottinghamforest:
    "nottmforest",

  internazionale:
    "inter",

  parissaintgermain:
    "psg",

  atleticoMadrid:
    "athmadrid",

  atleticodeMadrid:
    "athmadrid",

  istanbulbasaksehir:
    "basaksehir",

  caykurrizespor:
    "rizespor",

  gaziantepfk:
    "gaziantep",

  goztepe:
    "goztepe",

  alanyaspor:
    "alanyaspor"

};


function teamKey(name){

  const n = norm(name);

  return ALIASES[n] || n;

}


function sameTeam(
  apiName,
  csvName
){

  const a =
    teamKey(apiName);

  const b =
    teamKey(csvName);


  if(!a || !b){
    return false;
  }


  return(
    a === b ||
    (
      a.length >= 5 &&
      b.includes(a)
    ) ||
    (
      b.length >= 5 &&
      a.includes(b)
    )
  );

}


function num(v){

  const n =
    parseFloat(v);

  return Number.isFinite(n)
    ? n
    : null;

}


function completed(row){

  return(
    row.HomeTeam &&
    row.AwayTeam &&
    row.FTHG !== "" &&
    row.FTAG !== "" &&
    num(row.FTHG) !== null &&
    num(row.FTAG) !== null
  );

}


function lastGames(
  team,
  rows,
  venue=null
){

  let arr =
    rows.filter(row =>

      completed(row) &&

      (
        sameTeam(
          team,
          row.HomeTeam
        )

        ||

        sameTeam(
          team,
          row.AwayTeam
        )
      )

    );


  if(venue === "home"){

    arr =
      arr.filter(
        row =>
          sameTeam(
            team,
            row.HomeTeam
          )
      );

  }


  if(venue === "away"){

    arr =
      arr.filter(
        row =>
          sameTeam(
            team,
            row.AwayTeam
          )
      );

  }


  return arr
    .slice(-10)
    .reverse();

}


function form(
  team,
  games
){

  if(!games.length){

    return{
      n:0,
      gf:0,
      ga:0,
      ppg:0,
      btts:0,
      o15:0,
      o25:0,
      shots:0,
      sot:0,
      corners:0,
      cards:0,
      variance:0
    };

  }


  let gf=0;
  let ga=0;
  let pts=0;

  let btts=0;
  let o15=0;
  let o25=0;

  let shots=0;
  let shotSamples=0;

  let sot=0;
  let sotSamples=0;

  let corners=0;
  let cornerSamples=0;

  let cards=0;
  let cardSamples=0;

  let weights=0;

  const totals=[];


  games.forEach(
    (row,i) => {

      const home =
        sameTeam(
          team,
          row.HomeTeam
        );


      const scored =
        home
        ? num(row.FTHG)
        : num(row.FTAG);


      const conceded =
        home
        ? num(row.FTAG)
        : num(row.FTHG);


      const weight =
        Math.pow(
          0.90,
          i
        );


      gf +=
        scored * weight;

      ga +=
        conceded * weight;


      let p = 0;

      if(scored > conceded){
        p = 3;
      }else if(
        scored === conceded
      ){
        p = 1;
      }


      pts +=
        p * weight;

      weights += weight;


      if(
        scored > 0 &&
        conceded > 0
      ){
        btts++;
      }


      if(
        scored + conceded >= 2
      ){
        o15++;
      }


      if(
        scored + conceded >= 3
      ){
        o25++;
      }


      totals.push(
        scored + conceded
      );


      const s =
        home
        ? num(row.HS)
        : num(row.AS);


      if(s !== null){
        shots += s;
        shotSamples++;
      }


      const st =
        home
        ? num(row.HST)
        : num(row.AST);


      if(st !== null){
        sot += st;
        sotSamples++;
      }


      const c =
        home
        ? num(row.HC)
        : num(row.AC);


      if(c !== null){
        corners += c;
        cornerSamples++;
      }


      const y =
        home
        ? num(row.HY)
        : num(row.AY);


      const r =
        home
        ? num(row.HR)
        : num(row.AR);


      if(
        y !== null ||
        r !== null
      ){

        cards +=
          (y || 0)
          +
          (r || 0) * 2;

        cardSamples++;
      }

    }
  );


  const mean =
    totals.reduce(
      (a,b)=>a+b,
      0
    ) / totals.length;


  const variance =
    totals.reduce(
      (s,x)=>
        s +
        Math.pow(
          x - mean,
          2
        ),
      0
    ) / totals.length;


  return{

    n:games.length,

    gf:
      gf / weights,

    ga:
      ga / weights,

    ppg:
      pts / weights,

    btts:
      btts / games.length,

    o15:
      o15 / games.length,

    o25:
      o25 / games.length,

    shots:
      shotSamples
      ? shots / shotSamples
      : null,

    sot:
      sotSamples
      ? sot / sotSamples
      : null,

    corners:
      cornerSamples
      ? corners / cornerSamples
      : null,

    cards:
      cardSamples
      ? cards / cardSamples
      : null,

    variance

  };

}


function poisson(k,l){

  let f=1;

  for(
    let i=2;
    i<=k;
    i++
  ){
    f *= i;
  }


  return(
    Math.exp(-l)
    *
    Math.pow(l,k)
    /
    f
  );

}


function poissonMarkets(
  hx,
  ax
){

  let home=0;
  let draw=0;
  let away=0;

  let btts=0;
  let o15=0;
  let o25=0;
  let o35=0;


  for(
    let i=0;
    i<=8;
    i++
  ){

    for(
      let j=0;
      j<=8;
      j++
    ){

      const p =
        poisson(i,hx)
        *
        poisson(j,ax);


      if(i > j){
        home += p;
      }
      else if(i === j){
        draw += p;
      }
      else{
        away += p;
      }


      if(
        i > 0 &&
        j > 0
      ){
        btts += p;
      }


      if(i+j >= 2){
        o15 += p;
      }

      if(i+j >= 3){
        o25 += p;
      }

      if(i+j >= 4){
        o35 += p;
      }

    }

  }


  return{
    home,
    draw,
    away,
    btts,
    o15,
    o25,
    o35
  };

}


function blend(
  model,
  history,
  modelWeight=.72
){

  return(
    model * modelWeight
    +
    history * (1-modelWeight)
  );

}


function dataQuality(
  n1,
  n2,
  hasStats
){

  const n =
    Math.min(
      n1,
      n2
    );


  let score=10;


  if(n >= 10){
    score=95;
  }
  else if(n >= 8){
    score=88;
  }
  else if(n >= 6){
    score=78;
  }
  else if(n >= 4){
    score=63;
  }
  else if(n >= 2){
    score=42;
  }


  if(hasStats){
    score += 5;
  }


  return Math.min(
    100,
    score
  );

}


function grade(
  score,
  dq
){

  if(dq < 45){
    return[
      "PASS",
      "pass"
    ];
  }


  if(score >= 88){
    return[
      "A+",
      "aplus"
    ];
  }


  if(score >= 81){
    return[
      "A",
      "a"
    ];
  }


  if(score >= 72){
    return[
      "B",
      "b"
    ];
  }


  return[
    "PASS",
    "pass"
  ];

}


function findCurrentOdds(
  home,
  away,
  rows
){

  const row =
    rows.find(r =>

      sameTeam(
        home,
        r.HomeTeam
      )

      &&

      sameTeam(
        away,
        r.AwayTeam
      )

      &&

      !completed(r)

    );


  if(!row){
    return null;
  }


  const result={};


  const homeOdds =
    num(
      row.B365H ||
      row.AvgH ||
      row.MaxH
    );


  const drawOdds =
    num(
      row.B365D ||
      row.AvgD ||
      row.MaxD
    );


  const awayOdds =
    num(
      row.B365A ||
      row.AvgA ||
      row.MaxA
    );


  const over25 =
    num(
      row.B365O2_5 ||
      row.AvgO2_5 ||
      row.MaxO2_5
    );


  const under25 =
    num(
      row.B365U2_5 ||
      row.AvgU2_5 ||
      row.MaxU2_5
    );


  if(homeOdds){
    result.home=homeOdds;
  }

  if(drawOdds){
    result.draw=drawOdds;
  }

  if(awayOdds){
    result.away=awayOdds;
  }

  if(over25){
    result.o25=over25;
  }

  if(under25){
    result.u25=under25;
  }


  return(
    Object.keys(result).length
    ? result
    : null
  );

}


function analyze(
  fixture,
  rows,
  sourceName
){

  const home =
    fixture.teams.home.name;

  const away =
    fixture.teams.away.name;


  const hGames =
    lastGames(
      home,
      rows
    );


  const aGames =
    lastGames(
      away,
      rows
    );


  const hHomeGames =
    lastGames(
      home,
      rows,
      "home"
    );


  const aAwayGames =
    lastGames(
      away,
      rows,
      "away"
    );


  const hAll =
    form(
      home,
      hGames
    );


  const aAll =
    form(
      away,
      aGames
    );


  const hHome =
    form(
      home,
      hHomeGames
    );


  const aAway =
    form(
      away,
      aAwayGames
    );


  const statsAvailable =
    (
      hAll.shots !== null ||
      aAll.shots !== null
    );


  const dq =
    dataQuality(
      hAll.n,
      aAll.n,
      statsAvailable
    );


  if(
    hAll.n < 2 ||
    aAll.n < 2
  ){

    return{

      fixture,

      market:
        "VERİ YETERSİZ",

      probability:0,

      score:0,

      grade:"PASS",

      gradeClass:"pass",

      dataQuality:dq,

      noBet:true,

      source:sourceName,

      reason:
        "Takımlardan en az biri için yeterli geçmiş maç bulunamadı."

    };

  }


  const homeGF =
    hHome.n >= 3
    ? blend(
        hHome.gf,
        hAll.gf,
        .65
      )
    : hAll.gf;


  const homeGA =
    hHome.n >= 3
    ? blend(
        hHome.ga,
        hAll.ga,
        .65
      )
    : hAll.ga;


  const awayGF =
    aAway.n >= 3
    ? blend(
        aAway.gf,
        aAll.gf,
        .65
      )
    : aAll.gf;


  const awayGA =
    aAway.n >= 3
    ? blend(
        aAway.ga,
        aAll.ga,
        .65
      )
    : aAll.ga;


  let hx =
    .46 * homeGF
    +
    .34 * awayGA
    +
    .20 * 1.42;


  let ax =
    .46 * awayGF
    +
    .34 * homeGA
    +
    .20 * 1.18;


  if(
    hAll.sot !== null &&
    aAll.sot !== null
  ){

    const shotBoost =
      (
        hAll.sot -
        aAll.sot
      ) * .025;


    hx +=
      shotBoost;


    ax -=
      shotBoost * .40;

  }


  hx =
    Math.max(
      .25,
      Math.min(
        3.6,
        hx
      )
    );


  ax =
    Math.max(
      .20,
      Math.min(
        3.4,
        ax
      )
    );


  const p =
    poissonMarkets(
      hx,
      ax
    );


  const history = {

    btts:
      (
        hAll.btts +
        aAll.btts
      ) / 2,

    o15:
      (
        hAll.o15 +
        aAll.o15
      ) / 2,

    o25:
      (
        hAll.o25 +
        aAll.o25
      ) / 2

  };


  const markets = {

    "1.5 Üst":
      blend(
        p.o15,
        history.o15
      ),

    "2.5 Üst":
      blend(
        p.o25,
        history.o25
      ),

    "KG Var":
      blend(
        p.btts,
        history.btts
      ),

    "1X":
      p.home +
      p.draw,

    "X2":
      p.away +
      p.draw,

    "Ev Sahibi":
      p.home,

    "Deplasman":
      p.away,

    "3.5 Üst":
      p.o35

  };


  const ranked =
    Object.entries(
      markets
    )
    .map(
      ([name,probability]) => ({
        name,
        probability
      })
    )
    .sort(
      (a,b) =>
        b.probability -
        a.probability
    );


  const main =
    ranked[0];


  const secondary =
    ranked[1];


  const agreement =
    100 -
    Math.min(
      100,

      Math.abs(
        p.o25 -
        history.o25
      ) * 135

      +

      Math.abs(
        p.btts -
        history.btts
      ) * 90
    );


  const volatility =
    Math.min(
      100,
      (
        (
          hAll.variance +
          aAll.variance
        ) / 2
      ) * 23
    );


  let score =
    main.probability
    * 100;


  score +=
    dq * .06;


  score +=
    agreement * .045;


  score -=
    volatility * .035;


  if(
    hAll.n < 4 ||
    aAll.n < 4
  ){
    score -= 6;
  }


  score =
    Math.round(
      Math.max(
        0,
        Math.min(
          96,
          score
        )
      )
    );


  const g =
    grade(
      score,
      dq
    );


  const odds =
    findCurrentOdds(
      home,
      away,
      rows
    );


  const risks=[];


  if(dq < 70){
    risks.push(
      "Sınırlı sezon örneklemi"
    );
  }


  if(volatility > 65){
    risks.push(
      "Yüksek skor volatilitesi"
    );
  }


  if(
    hAll.n < 5 ||
    aAll.n < 5
  ){
    risks.push(
      "Sezon başı model belirsizliği"
    );
  }


  return{

    fixture,

    hx,
    ax,

    p,

    markets,

    hAll,
    aAll,

    score,

    grade:g[0],
    gradeClass:g[1],

    market:
      main.name,

    probability:
      main.probability,

    secondary,

    dataQuality:
      Math.round(dq),

    agreement:
      Math.round(
        agreement
      ),

    volatility:
      Math.round(
        volatility
      ),

    risks,

    odds,

    source:
      sourceName,

    noBet:
      g[0] === "PASS"

  };

}


function unsupportedAnalysis(
  fixture
){

  return{

    fixture,

    market:
      "GEÇMİŞ VERİ KAYNAĞI YOK",

    probability:0,

    score:0,

    grade:"PASS",

    gradeClass:"pass",

    dataQuality:0,

    noBet:true,

    source:
      "Fikstür: API-Football",

    reason:
      "Bu lig için ücretsiz güncel geçmiş maç kaynağı henüz GoalGrid'e bağlanmadı."

  };

}


async function run(
  force=false
){

  if(!apiKey()){

    alert(
      "API key bulunamadı. Önceki sürümde kaydettiğin key silinmiş olabilir."
    );

    return;

  }


  state.calls=0;

  $("#calls").textContent="0";


  const day =
    trDate();


  const cacheKey =
    "goalgrid_v12_"
    + day;


  if(
    !force &&
    localStorage.getItem(
      cacheKey
    )
  ){

    try{

      const cached =
        JSON.parse(
          localStorage.getItem(
            cacheKey
          )
        );


      if(
        Date.now() -
        cached.time
        <
        2 * 60 * 60 * 1000
      ){

        state.analyses =
          cached.analyses || [];


        render();


        $("#runStatus").textContent =
          "✓ Analiz telefon önbelleğinden açıldı. API kotası kullanılmadı.";


        return;

      }

    }catch{}

  }


  $("#runStatus").textContent =
    "Bugünün maçları alınıyor…";


  try{

    const raw =
      await api(
        `/fixtures?date=${day}&timezone=Europe/Istanbul`
      );


    const games =
      raw.filter(
        fixture =>
          LEAGUES[
            fixture.league.id
          ]
      );


    if(!games.length){

      state.analyses=[];

      render();


      $("#runStatus").textContent =
        "Bugün seçili liglerde maç bulunamadı.";


      return;

    }


    const csvCodes =
      [
        ...new Set(
          games
            .map(
              fixture =>
                LEAGUES[
                  fixture.league.id
                ]?.csv
            )
            .filter(Boolean)
        )
      ];


    $("#runStatus").textContent =
      `${games.length} maç bulundu. ${csvCodes.length} ücretsiz lig veri dosyası analiz ediliyor…`;


    const pools={};


    for(
      const code
      of csvCodes
    ){

      try{

        pools[code] =
          await loadCSV(
            code
          );

      }catch(error){

        pools[code]=[];

      }

    }


    state.analyses =
      games
        .map(
          fixture => {

            const config =
              LEAGUES[
                fixture.league.id
              ];


            if(
              !config.csv
            ){

              return unsupportedAnalysis(
                fixture
              );

            }


            const rows =
              pools[
                config.csv
              ] || [];


            if(!rows.length){

              return unsupportedAnalysis(
                fixture
              );

            }


            return analyze(
              fixture,
              rows,
              `Football-Data ${config.csv}`
            );

          }
        )
        .sort(
          (a,b) =>
            b.score -
            a.score
        );


    localStorage.setItem(
      cacheKey,
      JSON.stringify({
        time:Date.now(),
        analyses:state.analyses
      })
    );


    render();


    $("#runStatus").textContent =
      `✓ ${games.length} maç işlendi • ${state.calls} API çağrısı • ${csvCodes.length} ücretsiz veri dosyası kullanıldı.`;


  }catch(error){

    $("#runStatus").textContent =
      "Hata: "
      + error.message;

  }

}


function impliedProbability(
  odd
){

  return odd
    ? 1 / odd
    : null;

}


function valueLine(
  label,
  modelProbability,
  odd
){

  if(!odd){
    return "";
  }


  const market =
    impliedProbability(
      odd
    );


  const edge =
    (
      modelProbability -
      market
    ) * 100;


  return`
    <div class="oddsRow">

      <div>

        <b>
          ${label}
        </b>

        <div class="status">
          Model %${Math.round(modelProbability*100)}
        </div>

      </div>

      <div style="text-align:right">

        <b>
          ${odd.toFixed(2)}
        </b>

        <div class="status">
          Piyasa %${Math.round(market*100)}
        </div>

        <div class="${edge>=3?"value":"noValue"}">
          Edge ${edge>=0?"+":""}${edge.toFixed(1)}
        </div>

      </div>

    </div>
  `;

}


function oddsHTML(a){

  if(!a.odds){

    return`
      <div class="status warn">
        Bu maç için Football-Data dosyasında güncel oran bulunamadı.
      </div>
    `;

  }


  let html="";


  if(a.odds.home){

    html +=
      valueLine(
        "Ev Sahibi",
        a.markets["Ev Sahibi"],
        a.odds.home
      );

  }


  if(a.odds.away){

    html +=
      valueLine(
        "Deplasman",
        a.markets["Deplasman"],
        a.odds.away
      );

  }


  if(a.odds.o25){

    html +=
      valueLine(
        "2.5 Üst",
        a.markets["2.5 Üst"],
        a.odds.o25
      );

  }


  return(
    html ||
    `<div class="status warn">
      Desteklenen pazarlarda oran bulunamadı.
    </div>`
  );

}


function meter(
  label,
  value
){

  return`
    <div class="metric">

      <small>
        ${label}
      </small>

      <b>
        ${value}/100
      </b>

      <div class="bar">

        <div
          class="fill"
          style="width:${value}%">
        </div>

      </div>

    </div>
  `;

}

            <div class="teams">

            ${time}
          </div>

        <div class="pick">

          <div>

            <div class="market">
              ${a.market}

              <span class="grade pass">
                PASS
              </span>
            </div>

          </div>

        </div>

        <div class="reason bad">
          ${a.reason || "Yeterli veri bulunamadı."}
        </div>

        <div class="sourceTag">
          ${a.source}
        </div>

  return`

      <div class="head">

        <div>

          <div class="league">
            ${fixture.league.name}
          </div>

          <div class="teams">
            ${fixture.teams.home.name}
            —
            ${fixture.teams.away.name}

          ${time}

            </span>

          </div>

          <div class="status">
            GoalGrid Composite ${a.score}/100

        </div>

        <div class="prob">
          %${Math.round(a.probability*100)}
        </div>

      </div>


      <div class="metrics">

        <div class="metric">
          <small>Beklenen Gol</small>
          <b>
            ${a.hx.toFixed(2)}
            —
            ${a.ax.toFixed(2)}
          </b>
        </div>


        <div class="metric">
          <small>Toplam Gol</small>
          <b>
            ${(a.hx+a.ax).toFixed(2)}
          </b>
        </div>


        <div class="metric">
          <small>1.5 Üst</small>
          <b>
            %${Math.round(a.markets["1.5 Üst"]*100)}
          </b>
        </div>


        <div class="metric">
          <small>2.5 Üst</small>
          <b>
            %${Math.round(a.markets["2.5 Üst"]*100)}
          </b>
        </div>


        <div class="metric">
          <small>KG Var</small>
          <b>
            %${Math.round(a.markets["KG Var"]*100)}
          </b>
        </div>


        <div class="metric">
          <small>1X</small>
          <b>
            %${Math.round(a.markets["1X"]*100)}
          </b>
        </div>


        <div class="metric">
          <small>X2</small>
          <b>
            %${Math.round(a.markets["X2"]*100)}
          </b>
        </div>


        <div class="metric">
          <small>Alternatif</small>
          <b>
            ${a.secondary.name}
            %${Math.round(a.secondary.probability*100)}
          </b>
        </div>

      </div>


      <div class="section">

        <div class="sectionTitle">
          GERÇEK FORM
        </div>

        <div class="metrics">

          <div class="metric">
            <small>Örneklem</small>
            <b>
              ${a.hAll.n}
              /
              ${a.aAll.n}
            </b>
          </div>

          <div class="metric">
            <small>PPG</small>
            <b>
              ${a.hAll.ppg.toFixed(2)}
              /
              ${a.aAll.ppg.toFixed(2)}
            </b>
          </div>

          <div class="metric">
            <small>Gol Üretimi</small>
            <b>
              ${a.hAll.gf.toFixed(2)}
              /
              ${a.aAll.gf.toFixed(2)}
            </b>
          </div>

          <div class="metric">
            <small>Gol Yeme</small>
            <b>
              ${a.hAll.ga.toFixed(2)}
              /
              ${a.aAll.ga.toFixed(2)}
            </b>
          </div>

          <div class="metric">
            <small>Şut</small>
            <b>
              ${a.hAll.shots===null?"—":a.hAll.shots.toFixed(1)}
              /
              ${a.aAll.shots===null?"—":a.aAll.shots.toFixed(1)}

            </b>

          <div class="metric">
            <small>Korner</small>
            <b>
              ${a.hAll.corners===null?"—":a.hAll.corners.toFixed(1)}

            <small>Kart Etkisi</small>

      <div class="section">

            "Model Uyum",
            a.agreement

          ${meter(

            Math.max(
              0,
              100-a.volatility
            )
          )}

      </div>


      <div class="section">

        <div class="sectionTitle">
          NEDEN?
        </div>

        <div class="reason">

          Son ${a.hAll.n}/${a.aAll.n} maç •

          Ağırlıklı form:
          ${a.hAll.ppg.toFixed(2)}
          /
          ${a.aAll.ppg.toFixed(2)}
          PPG •

          Gol üretimi:
          ${a.hAll.gf.toFixed(2)}
          /
          ${a.aAll.gf.toFixed(2)} •

          Model ile tarihsel gol profili uyumu:
          ${a.agreement}/100

        </div>

      </div>


      <div class="section">

        <div class="sectionTitle">
          RİSKLER
        </div>

        <div class="reason ${a.risks.length?"warn":"good"}">

          ${
            a.risks.length
            ? a.risks.join(" • ")
            : "Mevcut ücretsiz veri katmanında belirgin yapısal risk tespit edilmedi."
          }

        </div>

      </div>


      <div class="section">

        <div class="sectionTitle">
          PİYASA / VALUE
        </div>

        <div class="oddsBox">
          ${oddsHTML(a)}
        </div>

      </div>


      <div class="sourceTag">
        Analiz kaynağı:
        ${a.source}
      </div>

    </section>
  `;

}


function render(){

  $("#nMatches").textContent =
    state.analyses.length;


  $("#nA").textContent =
    state.analyses.filter(
      a =>
        a.grade === "A"
        ||
        a.grade === "A+"
    ).length;


  $("#nPass").textContent =
    state.analyses.filter(
      a =>
        a.grade === "PASS"
    ).length;


  let list =
    [...state.analyses];


  if(
    state.tab === "best"
  ){

    list =
      list.filter(
        a =>
          a.grade === "A"
          ||
          a.grade === "A+"
      );

  }


  if(!list.length){

    $("#content").innerHTML =
      `
        <div class="empty">
          Bu kategoride maç bulunmuyor.
        </div>
      `;

    return;

  }


  $("#content").innerHTML =
    list
      .map(card)
      .join("");

}


document
  .querySelectorAll(".tab")
  .forEach(
    button => {

      button.onclick = () => {

        document
          .querySelectorAll(".tab")
          .forEach(
            x =>
              x.classList.remove("active")
          );


        button
          .classList
          .add("active");


        state.tab =
          button.dataset.tab;


        render();

      };

    }
  );
