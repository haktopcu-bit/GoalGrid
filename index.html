<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>GoalGrid V1.6</title>

<style>
:root{
  --bg:#07101d;
  --card:#101b2b;
  --card2:#142238;
  --text:#eef4ff;
  --muted:#8fa1b9;
  --green:#6ee7b7;
  --blue:#93c5fd;
  --line:#24324a;
  --red:#fb7185;
  --yellow:#fcd34d;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#08111f,#060b13);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:850px;
  margin:auto;
  padding:calc(22px + env(safe-area-inset-top)) 13px 250px;
}

h1{
  font-size:34px;
  margin:0;
}

.subtitle{
  margin:4px 0 17px;
  color:var(--muted);
}

.card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:11px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  font-size:14px;
  font-weight:850;
}

.primary{
  background:var(--green);
  color:#052218;
}

.secondary{
  background:#183149;
  color:#dcecff;
}

.danger{
  background:#40222d;
  color:#ffb7c4;
}

.muted{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.good{color:#8cf0c8}
.warn{color:#ffd78b}
.bad{color:#ff9cab}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:23px;
}

.stat small{
  color:var(--muted);
  font-size:10px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin:12px 0;
}

.tab{
  white-space:nowrap;
  background:#0d1726;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 12px;
}

.tab.active{
  background:#19394d;
  color:white;
}

.league{
  font-size:11px;
  color:var(--muted);
}

.teams{
  font-size:19px;
  font-weight:850;
  margin-top:3px;
}

.time{
  color:var(--blue);
  font-size:14px;
  font-weight:850;
}

.mainPick{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--line);
}

.pick{
  font-size:18px;
  font-weight:900;
}

.bigPct{
  font-size:29px;
  font-weight:900;
}

.grade{
  display:inline-block;
  padding:4px 8px;
  margin-left:6px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
}

.grade-aplus{
  background:#104934;
  color:#9cf4d0;
}

.grade-a{
  background:#193d60;
  color:#bbddff;
}

.grade-b{
  background:#4a3817;
  color:#ffe79c;
}

.grade-no{
  background:#41242f;
  color:#ffb9c6;
}

.reasonNo{
  margin-top:9px;
  padding:9px 10px;
  border:1px solid #49303b;
  border-radius:10px;
  background:#121722;
  color:#ffb5c2;
  font-size:11px;
  line-height:1.55;
}

.section{
  margin-top:13px;
  padding-top:11px;
  border-top:1px solid var(--line);
}

.sectionTitle{
  margin-bottom:8px;
  color:#bed0e6;
  font-size:11px;
  font-weight:900;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.metric{
  background:#0b1523;
  border:1px solid #213149;
  border-radius:11px;
  padding:10px;
}

.metric small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:4px;
}

.metric b{
  font-size:15px;
}

.grid3 .metric{
  text-align:center;
}

.grid3 .metric b{
  display:block;
  font-size:21px;
}

.bar{
  height:6px;
  margin-top:6px;
  background:#07101d;
  border-radius:999px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:var(--green);
}

.source{
  display:inline-block;
  margin-top:9px;
  padding:5px 8px;
  background:#0b2030;
  color:#9ac7e9;
  border-radius:999px;
  font-size:9px;
}

.sourceList{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

select,
input[type="number"]{
  width:100%;
  padding:10px;
  border:1px solid #31425d;
  border-radius:10px;
  background:#07101d;
  color:white;
  font-size:16px;
}

.oddsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.oddsCard{
  padding:10px;
  background:#091521;
  border:1px solid #26364d;
  border-radius:12px;
}

.oddsCard label{
  display:block;
  margin-bottom:6px;
  color:var(--muted);
  font-size:10px;
}

.oddsRow{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.oddsRow input[type="checkbox"]{
  width:23px;
  height:23px;
}

.oddsResult{
  margin-top:8px;
  color:#bdc9da;
  font-size:11px;
  line-height:1.55;
}

.history{
  margin-top:8px;
  padding-top:7px;
  border-top:1px dashed #26364d;
  color:var(--muted);
  font-size:10px;
}

.couponPanel{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(7,16,29,.97);
  backdrop-filter:blur(18px);
  border-top:1px solid #30415a;
}

.couponInner{
  max-width:850px;
  margin:auto;
}

.couponStats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:8px;
}

.couponStats .metric{
  text-align:center;
}

.couponDetails{
  max-height:260px;
  overflow:auto;
  margin-top:8px;
}

.couponLeg{
  padding:8px 0;
  border-top:1px solid #223149;
  font-size:11px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.actions button{
  flex:1;
}

.empty{
  padding:35px 10px;
  text-align:center;
  color:var(--muted);
}

.hidden{
  display:none;
}

@media(max-width:520px){
  .oddsGrid{
    grid-template-columns:1fr;
  }

  .couponStats{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<main>

<h1>⚽ GoalGrid</h1>
<p class="subtitle">Futbol Karar Motoru • V1.6</p>

<section class="card">
  <div class="row">
    <div>
      <b id="apiTitle">API</b>
      <div id="apiState" class="muted"></div>
    </div>

    <button class="secondary" onclick="changeApiKey()">
      Değiştir
    </button>
  </div>

  <div class="section">
    <div class="sectionTitle">VERİ KAYNAKLARI</div>

    <div class="sourceList">
      <span class="source">API-Football • Fikstür</span>
      <span class="source">football-data.org • Büyük Ligler</span>
      <span class="source">OpenFootball • Geçmiş / Yedek</span>
    </div>
  </div>
</section>

<section class="card">
  <div class="row">
    <div>
      <div class="league">BUGÜN</div>
      <div id="today" style="font-size:19px;font-weight:900"></div>
    </div>

    <button class="primary" onclick="scan()">
      Tara ve Analiz Et
    </button>
  </div>

  <div id="scanState" class="muted" style="margin-top:10px">
    Hazır.
  </div>
</section>

<section class="stats">

  <div class="card stat">
    <b id="matchCount">0</b>
    <small>MAÇ</small>
  </div>

  <div class="card stat">
    <b id="strongCount">0</b>
    <small>A / A+</small>
  </div>

  <div class="card stat">
    <b id="noCount">0</b>
    <small>OYNAMA</small>
  </div>

  <div class="card stat">
    <b id="apiCount">0</b>
    <small>API</small>
  </div>

</section>

<div class="tabs">

  <button class="tab active" data-tab="strong">
    En Güçlüler
  </button>

  <button class="tab" data-tab="all">
    Tüm Maçlar
  </button>

  <button class="tab" data-tab="coupons">
    Kupon Geçmişi
  </button>

</div>

<div id="content"></div>

</main>

<section id="couponPanel" class="couponPanel hidden">
  <div class="couponInner">

    <div class="row">
      <div>
        <b>🎟️ Aktif Kupon</b>
        <div id="couponCount" class="muted"></div>
      </div>

      <button class="secondary" onclick="toggleCouponDetails()">
        Ayrıntı
      </button>
    </div>

    <div class="couponStats">

      <div class="metric">
        <small>Toplam Oran</small>
        <b id="totalOdds">1.00</b>
      </div>

      <div class="metric">
        <small>Ortalama Güven</small>
        <b id="avgConfidence">—</b>
      </div>

      <div class="metric">
        <small>En Düşük Güven</small>
        <b id="minConfidence">—</b>
      </div>

      <div class="metric">
        <small>Birleşik Olasılık</small>
        <b id="jointProbability">—</b>
      </div>

    </div>

    <div id="couponDetails" class="hidden">

      <div id="couponLegs" class="couponDetails"></div>

      <div class="oddsGrid">

        <div class="oddsCard">
          <label>Mevcut Kasa</label>
          <input id="bankroll" type="number" inputmode="decimal" placeholder="1000">
        </div>

        <div class="oddsCard">
          <label>Yatırılacak Tutar</label>
          <input
            id="stake"
            type="number"
            inputmode="decimal"
            placeholder="1000"
            oninput="updateCoupon()">
        </div>

      </div>

      <div class="card" style="margin-top:8px">
        <small class="muted">Potansiyel Dönüş</small>
        <div id="potentialReturn" style="font-size:23px;font-weight:900">
          0 TL
        </div>
      </div>

      <div class="actions">

        <button class="primary" onclick="saveCoupon()">
          Kuponu Kaydet
        </button>

        <button class="danger" onclick="clearCoupon()">
          Temizle
        </button>

      </div>

    </div>

  </div>
</section>

<script>
const API_FOOTBALL =
  "https://v3.football.api-sports.io";


const LEAGUES = {
  39:{
    name:"Premier League",
    fd:"PL",
    of:"premierleague"
  },

  40:{
    name:"Championship",
    fd:"ELC",
    of:"championship"
  },

  78:{
    name:"Bundesliga",
    fd:"BL1",
    of:"bundesliga"
  },

  135:{
    name:"Serie A",
    fd:"SA",
    of:"seriea"
  },

  140:{
    name:"La Liga",
    fd:"PD",
    of:"laliga"
  },

  61:{
    name:"Ligue 1",
    fd:"FL1",
    of:"ligue1"
  },

  88:{
    name:"Eredivisie",
    fd:"DED",
    of:"eredivisie"
  },

  89:{
    name:"Eerste Divisie",
    fd:null,
    of:null
  },

  203:{
    name:"Süper Lig",
    fd:null,
    of:"superlig"
  },

  204:{
    name:"Türkiye 1. Lig",
    fd:null,
    of:null
  },

  144:{
    name:"Belçika Ligi",
    fd:null,
    of:"belcika"
  },

  2:{
    name:"Şampiyonlar Ligi",
    fd:"CL",
    of:null
  },

  3:{
    name:"Avrupa Ligi",
    fd:null,
    of:null
  },

  848:{
    name:"Konferans Ligi",
    fd:null,
    of:null
  }
};


let state = {
  analyses:[],
  tab:"strong",
  apiCalls:0,
  coupon:[]
};


const $ = selector =>
  document.querySelector(selector);


function apiKey(){
  return localStorage.getItem("goalgrid_api_key") || "";
}


function showApiState(){
  if(apiKey()){
    $("#apiTitle").textContent = "API-Football bağlı ✓";
    $("#apiState").textContent = "Anahtar bu telefonda kayıtlı.";
  }else{
    $("#apiTitle").textContent = "API-Football anahtarı yok";
    $("#apiState").textContent = "Bugünün fikstürü için anahtarı kaydet.";
  }
}


function changeApiKey(){
  const key = prompt(
    "API-Football anahtarını gir:",
    apiKey()
  );

  if(key === null) return;

  const clean = key.trim();

  if(!clean) return;

  localStorage.setItem(
    "goalgrid_api_key",
    clean
  );

  showApiState();
}


async function apiFootball(path){
  state.apiCalls++;
  $("#apiCount").textContent = state.apiCalls;

  const response =
    await fetch(
      API_FOOTBALL + path,
      {
        headers:{
          "x-apisports-key":apiKey()
        }
      }
    );

  const json =
    await response.json();

  if(
    json.errors &&
    Object.keys(json.errors).length
  ){
    throw new Error(
      JSON.stringify(json.errors)
    );
  }

  return json.response || [];
}


function todayISO(){
  return new Intl.DateTimeFormat(
    "en-CA",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      timeZone:"Europe/Istanbul"
    }
  ).format(new Date());
}


function normalizeText(value){
  return String(value || "")
    .toLocaleLowerCase("tr")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");
}


const TEAM_ALIASES = {
  cagliari:"cagliaricalcio",
  lecce:"uslecce",
  lazio:"sslazio",
  udinese:"udinesecalcio",
  inter:"fcinternazionalemilano",
  internazionale:"fcinternazionalemilano",
  napoli:"sscnapoli",
  roma:"asroma",
  atalanta:"atalantabc",
  milan:"acmilan",
  juventus:"juventusfc",
  fiorentina:"acffiorentina",
  bologna:"bolognafc1909",
  torino:"torinofc",
  parma:"parmacalcio1913",
  genoa:"genoacfc",
  como:"como1907",
  sassuolo:"ussassuolocalcio",

  getafe:"getafecf",
  celtavigo:"rcceltadevigo",
  celtadevigo:"rcceltadevigo",
  barcelona:"fcbarcelona",
  realmadrid:"realmadridcf",
  atleticomadrid:"atleticodemadrid",

  manchesterunited:"manchesterunitedfc",
  manchestercity:"manchestercityfc",
  liverpool:"liverpoolfc",
  arsenal:"arsenalfc",
  chelsea:"chelseafc",
  tottenham:"tottenhamhotspurfc",

  bayernmunich:"fcbayernmunchen",
  bayernmunchen:"fcbayernmunchen",

  caykurrizespor:"rizespor",
  gaziantepfk:"gaziantep",
  istanbulbasaksehir:"basaksehir",
  goztepe:"goztepe",
  alanyaspor:"alanyaspor"
};


function teamKey(name){
  const clean =
    normalizeText(name);

  return TEAM_ALIASES[clean] || clean;
}


function sameTeam(a,b){
  const x = teamKey(a);
  const y = teamKey(b);

  if(!x || !y) return false;

  if(x === y) return true;

  return(
    (x.length >= 6 && y.includes(x))
    ||
    (y.length >= 6 && x.includes(y))
  );
}


function normalizeFootballDataMatch(match){
  const home =
    match.evSahibi?.ad ||
    match.evSahibi?.kisaAd ||
    "";

  const away =
    match.deplasman?.ad ||
    match.deplasman?.kisaAd ||
    "";

  const homeScore =
    match.skor?.tamMac?.ev;

  const awayScore =
    match.skor?.tamMac?.deplasman;

  let score = null;

  if(
    Number.isFinite(Number(homeScore))
    &&
    Number.isFinite(Number(awayScore))
  ){
    score = {
      ft:[
        Number(homeScore),
        Number(awayScore)
      ]
    };

    const htHome =
      match.skor?.ilkYari?.ev;

    const htAway =
      match.skor?.ilkYari?.deplasman;

    if(
      Number.isFinite(Number(htHome))
      &&
      Number.isFinite(Number(htAway))
    ){
      score.ht = [
        Number(htHome),
        Number(htAway)
      ];
    }
  }

  const dateObj =
    new Date(match.tarih);

  return {
    date:
      Number.isNaN(dateObj.getTime())
      ? ""
      : dateObj.toISOString().slice(0,10),

    time:
      Number.isNaN(dateObj.getTime())
      ? ""
      : dateObj.toISOString().slice(11,16),

    team1:home,
    team2:away,
    score,
    source:"football-data.org"
  };
}


async function loadFootballData(code){
  if(!code) return [];

  const cacheKey =
    "goalgrid_fd_v16_" + code;

  const cached =
    localStorage.getItem(cacheKey);

  if(cached){
    try{
      const parsed =
        JSON.parse(cached);

      if(
        Date.now() - parsed.time
        <
        15 * 60 * 1000
      ){
        return parsed.matches;
      }
    }catch{}
  }

  const response =
    await fetch(
      `/football-data?competition=${encodeURIComponent(code)}`
    );

  if(!response.ok){
    throw new Error(
      `football-data.org ${response.status}`
    );
  }

  const json =
    await response.json();

  if(!json.ok){
    throw new Error(
      json.hata ||
      "football-data.org verisi alınamadı"
    );
  }

  const matches =
    (json.maclar || [])
      .map(normalizeFootballDataMatch)
      .filter(
        x =>
          x.team1 &&
          x.team2
      );

  localStorage.setItem(
    cacheKey,
    JSON.stringify({
      time:Date.now(),
      matches
    })
  );

  return matches;
}


async function loadOpenFootball(code){
  if(!code) return [];

  const cacheKey =
    "goalgrid_of_v16_" + code;

  const cached =
    localStorage.getItem(cacheKey);

  if(cached){
    try{
      const parsed =
        JSON.parse(cached);

      if(
        Date.now() - parsed.time
        <
        30 * 60 * 1000
      ){
        return parsed.matches;
      }
    }catch{}
  }

  const response =
    await fetch(
      `/data?league=${encodeURIComponent(code)}`
    );

  if(!response.ok){
    throw new Error(
      `OpenFootball ${response.status}`
    );
  }

  const json =
    await response.json();

  if(!json.ok){
    throw new Error(
      json.hata ||
      "OpenFootball verisi alınamadı"
    );
  }

  const matches =
    Array.isArray(json.maclar)
    ? json.maclar.map(x => ({
        ...x,
        source:"OpenFootball"
      }))
    : [];

  localStorage.setItem(
    cacheKey,
    JSON.stringify({
      time:Date.now(),
      matches
    })
  );

  return matches;
}


function mergeMatches(...groups){
  const map = new Map();

  groups.flat().forEach(match => {
    if(
      !match ||
      !match.team1 ||
      !match.team2
    ) return;

    const key =
      [
        match.date || "",
        teamKey(match.team1),
        teamKey(match.team2)
      ].join("|");

    const old =
      map.get(key);

    if(!old){
      map.set(key,match);
      return;
    }

    if(
      !old.score &&
      match.score
    ){
      map.set(key,match);
    }
  });

  return [...map.values()]
    .sort(
      (a,b) =>
        String(a.date)
        .localeCompare(
          String(b.date)
        )
    );
}


async function loadLeagueHistory(config){
  const results = [];
  const sources = [];
  const errors = [];

  if(config.fd){
    try{
      const fd =
        await loadFootballData(config.fd);

      if(fd.length){
        results.push(fd);
        sources.push(
          `football-data.org (${fd.length})`
        );
      }
    }catch(error){
      errors.push(
        "football-data.org: " +
        error.message
      );
    }
  }

  if(config.of){
    try{
      const of =
        await loadOpenFootball(config.of);

      if(of.length){
        results.push(of);
        sources.push(
          `OpenFootball (${of.length})`
        );
      }
    }catch(error){
      errors.push(
        "OpenFootball: " +
        error.message
      );
    }
  }

  return {
    matches:mergeMatches(...results),
    sources,
    errors
  };
}


function completed(match){
  return(
    match &&
    match.score &&
    Array.isArray(match.score.ft) &&
    match.score.ft.length >= 2 &&
    Number.isFinite(Number(match.score.ft[0])) &&
    Number.isFinite(Number(match.score.ft[1]))
  );
}


function lastMatches(
  team,
  allMatches,
  targetDate,
  venue=null
){
  let list =
    allMatches.filter(
      match =>
        completed(match)
        &&
        String(match.date) < targetDate
        &&
        (
          sameTeam(team,match.team1)
          ||
          sameTeam(team,match.team2)
        )
    );

  if(venue === "home"){
    list =
      list.filter(
        match =>
          sameTeam(team,match.team1)
      );
  }

  if(venue === "away"){
    list =
      list.filter(
        match =>
          sameTeam(team,match.team2)
      );
  }

  return list
    .sort(
      (a,b) =>
        String(b.date)
        .localeCompare(
          String(a.date)
        )
    )
    .slice(0,10);
}


function formStats(team,matches){
  if(!matches.length){
    return{
      count:0,
      scored:0,
      conceded:0,
      ppg:0,
      btts:0,
      over15:0,
      over25:0,
      avgGoals:0,
      variance:0,
      wins:0,
      draws:0,
      losses:0,
      cleanSheets:0
    };
  }

  let scored=0;
  let conceded=0;
  let points=0;
  let totalWeight=0;

  let btts=0;
  let over15=0;
  let over25=0;

  let wins=0;
  let draws=0;
  let losses=0;
  let cleanSheets=0;

  const goalTotals=[];

  matches.forEach((match,index)=>{
    const isHome =
      sameTeam(team,match.team1);

    const ft =
      match.score.ft;

    const gf =
      isHome
      ? Number(ft[0])
      : Number(ft[1]);

    const ga =
      isHome
      ? Number(ft[1])
      : Number(ft[0]);

    const weight =
      Math.pow(.90,index);

    scored += gf * weight;
    conceded += ga * weight;
    totalWeight += weight;

    if(gf > ga){
      points += 3 * weight;
      wins++;
    }else if(gf === ga){
      points += weight;
      draws++;
    }else{
      losses++;
    }

    if(gf > 0 && ga > 0) btts++;
    if(gf + ga >= 2) over15++;
    if(gf + ga >= 3) over25++;
    if(ga === 0) cleanSheets++;

    goalTotals.push(gf + ga);
  });

  const avgGoals =
    goalTotals.reduce(
      (a,b)=>a+b,
      0
    ) / goalTotals.length;

  const variance =
    goalTotals.reduce(
      (sum,value) =>
        sum +
        Math.pow(
          value - avgGoals,
          2
        ),
      0
    ) / goalTotals.length;

  return{
    count:matches.length,
    scored:scored/totalWeight,
    conceded:conceded/totalWeight,
    ppg:points/totalWeight,
    btts:btts/matches.length,
    over15:over15/matches.length,
    over25:over25/matches.length,
    avgGoals,
    variance,
    wins,
    draws,
    losses,
    cleanSheets:cleanSheets/matches.length
  };
}


function poisson(goals,lambda){
  let factorial = 1;

  for(let i=2;i<=goals;i++){
    factorial *= i;
  }

  return(
    Math.exp(-lambda)
    *
    Math.pow(lambda,goals)
    /
    factorial
  );
}


function marketModel(homeXg,awayXg){
  let home=0;
  let draw=0;
  let away=0;

  let btts=0;
  let over15=0;
  let over25=0;
  let over35=0;

  for(let hg=0;hg<=8;hg++){
    for(let ag=0;ag<=8;ag++){
      const p =
        poisson(hg,homeXg)
        *
        poisson(ag,awayXg);

      if(hg > ag) home += p;
      else if(hg === ag) draw += p;
      else away += p;

      if(hg > 0 && ag > 0) btts += p;
      if(hg + ag >= 2) over15 += p;
      if(hg + ag >= 3) over25 += p;
      if(hg + ag >= 4) over35 += p;
    }
  }

  return{
    home,
    draw,
    away,
    btts,
    over15,
    over25,
    over35
  };
}


function blend(a,b,aWeight=.70){
  return(
    a * aWeight
    +
    b * (1-aWeight)
  );
}


function dataQuality(homeCount,awayCount){
  const count =
    Math.min(
      homeCount,
      awayCount
    );

  if(count >= 10) return 100;
  if(count >= 8) return 90;
  if(count >= 6) return 80;
  if(count >= 5) return 72;
  if(count >= 4) return 62;
  if(count >= 3) return 50;
  if(count >= 2) return 38;

  return 10;
}


function grade(
  score,
  quality,
  probability
){
  if(quality < 45){
    return["OYNAMA","grade-no"];
  }

  if(
    probability >= .80 &&
    score >= 88
  ){
    return["A+","grade-aplus"];
  }

  if(
    probability >= .73 &&
    score >= 82
  ){
    return["A","grade-a"];
  }

  if(
    probability >= .66 &&
    score >= 74
  ){
    return["B","grade-b"];
  }

  return["OYNAMA","grade-no"];
}


function noReason(probability,score,quality){
  if(quality < 45){
    return(
      `Veri kalitesi ${quality}/100. Güvenilir sınıflandırma için en az 45/100 gerekiyor.`
    );
  }

  if(probability < .66){
    return(
      `En güçlü pazarın model olasılığı %${(probability*100).toFixed(1)}. B sınıfı için en az %66 gerekiyor.`
    );
  }

  if(score < 74){
    return(
      `Olasılık sınırı geçiliyor ancak güven puanı ${score}/100. B sınıfı için en az 74/100 gerekiyor.`
    );
  }

  return(
    "Veri kaynakları ve model bileşenleri yeterli ortak doğrulama üretmedi."
  );
}


function analyseFixture(
  fixture,
  history,
  sourceNames
){
  const home =
    fixture.teams.home.name;

  const away =
    fixture.teams.away.name;

  const date =
    fixture.fixture.date.slice(0,10);

  const homeLast =
    lastMatches(
      home,
      history,
      date
    );

  const awayLast =
    lastMatches(
      away,
      history,
      date
    );

  const homeVenue =
    lastMatches(
      home,
      history,
      date,
      "home"
    );

  const awayVenue =
    lastMatches(
      away,
      history,
      date,
      "away"
    );

  const hf =
    formStats(home,homeLast);

  const af =
    formStats(away,awayLast);

  const hv =
    formStats(home,homeVenue);

  const av =
    formStats(away,awayVenue);

  const quality =
    dataQuality(
      hf.count,
      af.count
    );

  if(
    hf.count < 2 ||
    af.count < 2
  ){
    return{
      fixture,
      grade:"OYNAMA",
      gradeClass:"grade-no",
      mainMarket:"VERİ YETERSİZ",
      mainProbability:0,
      score:0,
      quality,
      reason:
        "Takımlardan biri için yeterli geçmiş maç bulunamadı.",
      sources:
        sourceNames,
      homeForm:null,
      awayForm:null
    };
  }

  const homeAttack =
    hv.count >= 3
    ? blend(hv.scored,hf.scored,.62)
    : hf.scored;

  const homeDefense =
    hv.count >= 3
    ? blend(hv.conceded,hf.conceded,.62)
    : hf.conceded;

  const awayAttack =
    av.count >= 3
    ? blend(av.scored,af.scored,.62)
    : af.scored;

  const awayDefense =
    av.count >= 3
    ? blend(av.conceded,af.conceded,.62)
    : af.conceded;

  let homeXg =
    .48 * homeAttack
    +
    .34 * awayDefense
    +
    .18 * 1.38;

  let awayXg =
    .48 * awayAttack
    +
    .34 * homeDefense
    +
    .18 * 1.15;

  homeXg =
    Math.max(
      .25,
      Math.min(3.6,homeXg)
    );

  awayXg =
    Math.max(
      .20,
      Math.min(3.4,awayXg)
    );

  const model =
    marketModel(
      homeXg,
      awayXg
    );

  const historical = {
    btts:
      (hf.btts + af.btts) / 2,

    over15:
      (hf.over15 + af.over15) / 2,

    over25:
      (hf.over25 + af.over25) / 2
  };

  const markets = {
    "1.5 Üst":
      blend(
        model.over15,
        historical.over15
      ),

    "2.5 Üst":
      blend(
        model.over25,
        historical.over25
      ),

    "KG Var":
      blend(
        model.btts,
        historical.btts
      ),

    "1X":
      model.home + model.draw,

    "X2":
      model.away + model.draw,

    "Ev Sahibi":
      model.home,

    "Beraberlik":
      model.draw,

    "Deplasman":
      model.away,

    "3.5 Üst":
      model.over35
  };

  const ranking =
    Object.entries(markets)
      .map(
        ([name,probability]) => ({
          name,
          probability
        })
      )
      .sort(
        (a,b) =>
          b.probability -
          a.probability
      );

  const main =
    ranking[0];

  const alternative =
    ranking[1];

  const agreement =
    100 -
    Math.min(
      100,
      Math.abs(
        model.over25 -
        historical.over25
      ) * 120
      +
      Math.abs(
        model.btts -
        historical.btts
      ) * 90
    );

  const volatility =
    Math.min(
      100,
      (
        (hf.variance + af.variance)
        /
        2
      ) * 22
    );

  const stability =
    Math.max(
      0,
      100 - volatility
    );

  let score =
    main.probability * 78
    +
    quality * .08
    +
    agreement * .07
    +
    stability * .07;

  if(quality < 60){
    score -= 8;
  }

  if(main.probability < .65){
    score -= 6;
  }

  score =
    Math.round(
      Math.max(
        0,
        Math.min(
          96,
          score
        )
      )
    );

  const gradeResult =
    grade(
      score,
      quality,
      main.probability
    );

  const risks=[];

  if(quality < 70){
    risks.push(
      "Geçmiş maç örneklemi sınırlı"
    );
  }

  if(volatility >= 65){
    risks.push(
      "Skor profili yüksek oynaklık gösteriyor"
    );
  }

  if(
    hf.cleanSheets < .20 &&
    af.cleanSheets < .20
  ){
    risks.push(
      "İki takımın savunma güvenilirliği düşük"
    );
  }

  return{
    fixture,
    homeXg,
    awayXg,
    markets,
    homeForm:hf,
    awayForm:af,
    quality,
    agreement:
      Math.round(agreement),
    volatility:
      Math.round(volatility),
    stability:
      Math.round(stability),
    score,
    grade:gradeResult[0],
    gradeClass:gradeResult[1],
    mainMarket:main.name,
    mainProbability:
      main.probability,
    alternative,
    risks,
    noReason:
      gradeResult[0] === "OYNAMA"
      ? noReason(
          main.probability,
          score,
          quality
        )
      : "",
    sources:sourceNames
  };
}

async function scan(){
  if(!apiKey()){
    changeApiKey();

    if(!apiKey()){
      return;
    }
  }

  state.apiCalls = 0;
  $("#apiCount").textContent = "0";

  $("#scanState").textContent =
    "Bugünün fikstürü alınıyor…";

  try{
    const date =
      todayISO();

    const fixtures =
      await apiFootball(
        `/fixtures?date=${date}&timezone=Europe/Istanbul`
      );

    const selectedFixtures =
      fixtures.filter(
        fixture =>
          Boolean(
            LEAGUES[
              fixture.league.id
            ]
          )
      );

    const leagueIds =
      [
        ...new Set(
          selectedFixtures.map(
            fixture =>
              fixture.league.id
          )
        )
      ];

    $("#scanState").textContent =
      `${selectedFixtures.length} maç bulundu. ${leagueIds.length} lig için geçmiş veriler hazırlanıyor…`;

    const histories={};

    for(const leagueId of leagueIds){
      const config =
        LEAGUES[leagueId];

      try{
        histories[leagueId] =
          await loadLeagueHistory(
            config
          );
      }catch(error){
        histories[leagueId] = {
          matches:[],
          sources:[],
          errors:[
            error.message
          ]
        };
      }
    }

    state.analyses =
      selectedFixtures
        .map(
          fixture => {
            const leagueId =
              fixture.league.id;

            const config =
              LEAGUES[leagueId];

            const history =
              histories[leagueId];

            if(
              !config.fd &&
              !config.of
            ){
              return(
                noDataAnalysis(
                  fixture,
                  "Bu lig için geçmiş veri kaynağı henüz bağlanmadı."
                )
              );
            }

            if(
              !history ||
              !history.matches.length
            ){
              const detail =
                history?.errors?.length
                ? history.errors.join(" • ")
                : "Geçmiş maç bulunamadı.";

              return(
                noDataAnalysis(
                  fixture,
                  detail
                )
              );
            }

            return(
              analyseFixture(
                fixture,
                history.matches,
                history.sources
              )
            );
          }
        )
        .sort(
          (a,b) =>
            b.score - a.score
        );

    syncCouponWithAnalyses();

    render();

    $("#scanState").textContent =
      `✓ ${selectedFixtures.length} maç analiz edildi • ${state.apiCalls} API-Football çağrısı.`;

  }catch(error){
    $("#scanState").textContent =
      "Hata: " + error.message;
  }
}


function oddsHistoryRead(){
  const keys = [
    "goalgrid_oran_gecmisi_v16",
    "goalgrid_oran_gecmisi_v152",
    "goalgrid_oran_gecmisi_v15"
  ];

  for(const key of keys){
    try{
      const value =
        JSON.parse(
          localStorage.getItem(key)
        );

      if(
        Array.isArray(value) &&
        value.length
      ){
        return value;
      }
    }catch{}
  }

  return[];
}


function oddsHistoryWrite(list){
  localStorage.setItem(
    "goalgrid_oran_gecmisi_v16",
    JSON.stringify(list)
  );
}


function addOddsHistory(record){
  const list =
    oddsHistoryRead();

  list.push(record);

  if(list.length > 5000){
    list.splice(
      0,
      list.length - 5000
    );
  }

  oddsHistoryWrite(list);
}


function oddsHistoryText(
  matchId,
  market,
  type
){
  const list =
    oddsHistoryRead()
      .filter(
        x =>
          x.matchId === matchId
          &&
          x.market === market
          &&
          x.type === type
      )
      .slice(-4)
      .reverse();

  if(!list.length){
    return(
      "Bu pazar için daha önce oran girmedin."
    );
  }

  return list
    .map(record=>{
      const time =
        new Date(record.time)
          .toLocaleTimeString(
            "tr-TR",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          );

      return(
        `${time} • ${record.site} ${record.odds.toFixed(2)}`
      );
    })
    .join("<br>");
}


function safeId(value){
  return normalizeText(value);
}


function evaluateOdds(
  analysisIndex,
  market,
  type
){
  const analysis =
    state.analyses[
      analysisIndex
    ];

  const id =
    safeId(market);

  const odds =
    Number(
      $(
        `#odds_${type}_${analysisIndex}_${id}`
      ).value
    );

  if(
    !Number.isFinite(odds)
    ||
    odds <= 1
  ){
    alert("Geçerli bir oran gir.");
    return;
  }

  const site =
    type === "international"
    ? "Jojobet"
    : $(
        `#site_${type}_${analysisIndex}_${id}`
      ).value;

  const modelProbability =
    analysis.markets[market] || 0;

  const marketProbability =
    1 / odds;

  const fairOdds =
    modelProbability > 0
    ? 1 / modelProbability
    : null;

  const probabilityEdge =
    (
      modelProbability -
      marketProbability
    ) * 100;

  const value =
    (
      odds *
      modelProbability -
      1
    ) * 100;

  let comment =
    "Değer görünmüyor";

  if(value >= 12){
    comment = "Çok güçlü değer";
  }else if(value >= 7){
    comment = "Güçlü değer";
  }else if(value >= 3){
    comment = "Olumlu değer";
  }else if(value >= 0){
    comment = "Sınırlı değer";
  }

  addOddsHistory({
    time:new Date().toISOString(),
    matchId:
      analysis.fixture.fixture.id,
    league:
      analysis.fixture.league.name,
    home:
      analysis.fixture.teams.home.name,
    away:
      analysis.fixture.teams.away.name,
    market,
    type,
    site,
    odds,
    modelProbability,
    marketProbability,
    fairOdds,
    probabilityEdge,
    value,
    score:
      analysis.score
  });

  $(
    `#oddsResult_${type}_${analysisIndex}_${id}`
  ).innerHTML =
    `
      Model olasılığı:
      <b>%${(modelProbability*100).toFixed(1)}</b><br>

      Piyasa olasılığı:
      %${(marketProbability*100).toFixed(1)}<br>

      Adil oran:
      <b>${fairOdds ? fairOdds.toFixed(2) : "—"}</b><br>

      Olasılık farkı:
      ${probabilityEdge>=0?"+":""}${probabilityEdge.toFixed(1)} puan<br>

      Oransal değer:
      ${value>=0?"+":""}${value.toFixed(1)}%<br>

      <b>${comment}</b>
    `;

  $(
    `#history_${type}_${analysisIndex}_${id}`
  ).innerHTML =
    oddsHistoryText(
      analysis.fixture.fixture.id,
      market,
      type
    );
}

function couponSelectionChanged(
  analysisIndex,
  market,
  type
){
  const analysis =
    state.analyses[
      analysisIndex
    ];

  const id =
    safeId(market);

  const checkbox =
    $(
      `#coupon_${type}_${analysisIndex}_${id}`
    );

  const odds =
    Number(
      $(
        `#odds_${type}_${analysisIndex}_${id}`
      ).value
    );

  if(
    checkbox.checked
    &&
    (
      !Number.isFinite(odds)
      ||
      odds <= 1
    )
  ){
    alert(
      "Kupona eklemeden önce oranı gir."
    );

    checkbox.checked = false;
    return;
  }

  const site =
    type === "international"
    ? "Jojobet"
    : $(
        `#site_${type}_${analysisIndex}_${id}`
      ).value;

  if(checkbox.checked){
    const duplicate =
      state.coupon.some(
        item =>
          item.matchId ===
          analysis.fixture.fixture.id
          &&
          item.market === market
          &&
          item.type === type
          &&
          item.site === site
      );

    if(duplicate){
      return;
    }

    const sameMatch =
      state.coupon.some(
        item =>
          item.matchId ===
          analysis.fixture.fixture.id
      );

    if(sameMatch){
      const accept =
        confirm(
          "Bu maçtan kuponda başka bir seçim var. Yine de eklemek istiyor musun?"
        );

      if(!accept){
        checkbox.checked = false;
        return;
      }
    }

    state.coupon.push({
      id:Date.now()+Math.random(),
      matchId:
        analysis.fixture.fixture.id,
      match:
        `${analysis.fixture.teams.home.name} - ${analysis.fixture.teams.away.name}`,
      market,
      type,
      site,
      odds,
      modelProbability:
        analysis.markets[market],
      score:
        analysis.score
    });

  }else{
    state.coupon =
      state.coupon.filter(
        item =>
          !(
            item.matchId ===
            analysis.fixture.fixture.id
            &&
            item.market === market
            &&
            item.type === type
            &&
            item.site === site
          )
      );
  }

  saveActiveCoupon();
  updateCoupon();
}


function syncCouponWithAnalyses(){
  if(!state.coupon.length){
    return;
  }

  state.coupon =
    state.coupon.map(item=>{
      const analysis =
        state.analyses.find(
          x =>
            x.fixture?.fixture?.id
            ===
            item.matchId
        );

      if(
        !analysis ||
        !analysis.markets
      ){
        return item;
      }

      return{
        ...item,
        score:
          analysis.score,
        modelProbability:
          Number.isFinite(
            analysis.markets[
              item.market
            ]
          )
          ? analysis.markets[item.market]
          : item.modelProbability
      };
    });

  saveActiveCoupon();
  updateCoupon();
}


function updateCoupon(){
  if(!state.coupon.length){
    $("#couponPanel")
      .classList.add("hidden");

    saveActiveCoupon();
    return;
  }

  $("#couponPanel")
    .classList.remove("hidden");

  let totalOdds = 1;
  let scoreSum = 0;
  let minScore = 100;
  let joint = 1;

  state.coupon.forEach(item=>{
    totalOdds *= item.odds;
    scoreSum += item.score;
    minScore =
      Math.min(
        minScore,
        item.score
      );
    joint *=
      item.modelProbability;
  });

  $("#couponCount").textContent =
    `${state.coupon.length} seçim`;

  $("#totalOdds").textContent =
    totalOdds.toFixed(2);

  $("#avgConfidence").textContent =
    Math.round(
      scoreSum /
      state.coupon.length
    ) + "/100";

  $("#minConfidence").textContent =
    minScore + "/100";

  $("#jointProbability").textContent =
    "%" + (joint*100).toFixed(1);

  $("#couponLegs").innerHTML =
    state.coupon
      .map(item=>`
        <div class="couponLeg">
          <b>${item.match}</b>
          <div class="muted">
            ${item.market}
            • ${item.site}
            @ ${item.odds.toFixed(2)}
            • Güven ${item.score}/100
          </div>
        </div>
      `)
      .join("");

  const stake =
    Number(
      $("#stake")?.value
    ) || 0;

  $("#potentialReturn").textContent =
    (
      stake *
      totalOdds
    ).toLocaleString(
      "tr-TR",
      {
        maximumFractionDigits:2
      }
    ) + " TL";

  saveActiveCoupon();
}

function clearCoupon(){
  state.coupon=[];

  document
    .querySelectorAll(
      'input[type="checkbox"]'

        box.checked = false
    );

  saveActiveCoupon();
  updateCoupon();
}


function couponHistoryRead(){
  const keys = [
    "goalgrid_kupon_gecmisi_v16",
    "goalgrid_kupon_gecmisi_v152"
  ];

  for(const key of keys){
    try{
      const value =
        JSON.parse(
          localStorage.getItem(key)
        );

      if(
        Array.isArray(value) &&
        value.length
      ){
        return value;
      }
    }catch{}
  }

  return[];
}


function saveCoupon(){
  if(!state.coupon.length){
    return;
  }

  let totalOdds=1;

  state.coupon.forEach(
    item =>
      totalOdds *= item.odds
  );

  const bankroll =
    Number(
      $("#bankroll").value
    ) || 0;

  const stake =
    Number(
      $("#stake").value
    ) || 0;

  const record = {
    id:Date.now(),
    time:new Date().toISOString(),
    bankroll,
    stake,
    totalOdds,
    potential:
      stake * totalOdds,
    selections:
      JSON.parse(
        JSON.stringify(
          state.coupon
        )
      ),
    result:"Bekliyor"
  };

  const history =
    couponHistoryRead();

  history.unshift(record);

  localStorage.setItem(
    "goalgrid_kupon_gecmisi_v16",
    JSON.stringify(history)
  );

  alert(
    "Kupon geçmişe kaydedildi."
  );
}

function oddsArea(
  analysis,
  index
){
  const markets =
    Object.entries(
      analysis.markets
    )
    .sort(
      (a,b)=>b[1]-a[1]
    )
    .map(x=>x[0]);

  const options =
    markets
      .map(
        market=>`
          <option
            value="${market}"
            ${market===analysis.mainMarket?"selected":""}>
            ${market}
            (%${Math.round(analysis.markets[market]*100)})
          </option>
        `
      )
      .join("");

  return`
    <div class="section">

      <div class="sectionTitle">

      </div>

      <select
        id="market_${index}"
        onchange="refreshOddsArea(${index})">

        ${

            analysis,
            index,
            analysis.mainMarket

  `;
}

function couponHistoryRender(){
  const history =
    couponHistoryRead();

  if(!history.length){
    $("#content").innerHTML =
      `
        <div class="empty">
          Henüz kayıtlı kupon bulunmuyor.
        </div>
      `;
    return;
  }

  $("#content").innerHTML =
    history
      .map(coupon=>`
        <section class="card">

          <div class="row">

            <div>
              <b>
                ${new Date(coupon.time).toLocaleString("tr-TR")}
              </b>

              <div class="muted">
                ${(coupon.selections || []).length} seçim
              </div>
            </div>

            <div style="font-size:22px;font-weight:900">
              ${Number(coupon.totalOdds || 1).toFixed(2)}
            </div>

          </div>

          <div class="section">

            ${
              (coupon.selections || [])
                .map(item=>`
                  <div class="couponLeg">

                    <b>
                      ${item.match}
                    </b>

                    <div class="muted">

                      ${item.market}
                      • ${item.site}
                      @ ${Number(item.odds).toFixed(2)}
                      • Güven ${item.score}/100

                    </div>

                  </div>
                `)
                .join("")
            }

          </div>

        </section>
      `)
      .join("");
}


function render(){
  $("#matchCount").textContent =
    state.analyses.length;

  $("#strongCount").textContent =
    state.analyses
      .filter(
        x =>
          x.grade === "A"
          ||
          x.grade === "A+"
      )
      .length;

  $("#noCount").textContent =
    state.analyses
      .filter(
        x =>
          x.grade === "OYNAMA"
      )
      .length;

  if(state.tab === "coupons"){
    couponHistoryRender();
    return;
  }

  let list =
    [...state.analyses];

  if(state.tab === "strong"){
    list =
      list.filter(
        x =>
          x.grade === "A"
          ||
          x.grade === "A+"
      );
  }

  if(!list.length){
    $("#content").innerHTML =
      `
        <div class="empty">
          Bu kategoride maç bulunmuyor.
        </div>
      `;
    return;
  }

  $("#content").innerHTML =
    list
      .map(
        analysis =>
          matchCard(
            analysis,
            state.analyses.indexOf(analysis)
          )
      )
      .join("");
}
