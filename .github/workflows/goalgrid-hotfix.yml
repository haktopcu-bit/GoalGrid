name: GoalGrid Hotfix

on:
  push:
    paths:
      - 'tools/goalgrid_hotfix.py'
      - 'tools/goalgrid_hotfix2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply latest GoalGrid hotfix
        run: |
          if [ -f tools/goalgrid_hotfix2.py ]; then
            python tools/goalgrid_hotfix2.py
          else
            python tools/goalgrid_hotfix.py
          fi
      - name: Commit patched index
        run: |
          git config user.name "goalgrid-bot"
          git config user.email "goalgrid-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Force UEFA and Dutch competitions into GoalGrid"
            git push
          fi
