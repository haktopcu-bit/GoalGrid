name: GoalGrid Hotfix

on:
  push:
    paths:
      - 'tools/goalgrid_hotfix9.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply GoalGrid V1.10.1 hotfix
        run: python tools/goalgrid_hotfix9.py
      - name: Commit patched GoalGrid
        run: |
          git config user.name "goalgrid-bot"
          git config user.email "goalgrid-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Remove stale Sofascore calls and restore data fallback"
            git push
          fi
